# FAQ (/faq) — ТЗ §4: сжатый FAQ. Старт регистрации назван в формулировке,
# верной и до, и после дня открытия: страница статическая, а момент деплоя
# относительно этого дня не известен (Issue #108).
# Каждый ответ разделяет прошлое и 2027 год: факты конгресса 2026 приведены как
# факты 2026 (источник — docs/recon/orthobio-ru-main.md), условия 2027 года
# честно помечены как ещё не объявленные. Даты подтверждены владельцем
# 2026-07-31 (Issue #69); площадка и дата регистрации — 2026-08-05 (Issue #71);
# дедлайны приёма материалов — ТЗ организаторов на 2027 год (Issue #108).

title: Вопросы и ответы
description: Частые вопросы о конгрессе ОРТОБИОЛОГИЯ 2027 - формат, участие, баллы НМО, материалы прошлых лет.
lead: []
blocks:
  - kind: faq
    heading: null
    items:
      - q: Когда и где пройдёт конгресс 2027 года?
        a: 23-24 апреля 2027 года, ГК «Милан», Москва, ул. Шипиловская, д. 28А.
      - q: Когда начинается регистрация?
        a: Регистрация на VIII конгресс — с 1 октября 2026 года.
      - q: Участие платное?
        a: На конгрессе 2026 года участие было бесплатным. Условия участия в 2027 году будут объявлены дополнительно.
      - q: Будет ли трансляция?
        a: Конгресс 2026 года проходил очно, трансляция и запись не велись. Формат 2027 года будет объявлен.
      # Ответ не начинается со слова «Да»: аккредитация НМО подаётся на каждое
      # мероприятие отдельно, для конгресса-2027 она ещё не подтверждена
      # (контент-аудит К3).
      - q: Начисляются ли баллы НМО?
        a: 'Конгрессы ОРТОБИОЛОГИЯ аккредитуются в системе НМО: на конгрессе 2026 года начислялось 6 баллов за день участия. Аккредитация 2027 года будет подтверждена дополнительно — подробности в разделе «НМО».'
      # В ответе есть слово о регистрации, поэтому дедлайны в нём — только
      # токены: tests/unit/content-dates.test.ts сверяет с REGISTRATION_OPENS
      # любую литеральную дату в такой строке (комментарии тоже).
      # {{oralTalkDeadline}} / {{posterAbstractDeadline}} подставляются при
      # сборке из SUBMISSION_DEADLINES (src/config/site.ts, Issue #108) — даты
      # меняют там, не здесь.
      - q: Как подать доклад или тезисы?
        a: 'Формы участия и требования к материалам — в разделе «Участникам». Материалы подаются в личном кабинете участника после регистрации на конгресс; приём откроется в ближайшее время. Дедлайны: устные доклады — до {{oralTalkDeadline}}, постерные доклады и тезисы — до {{posterAbstractDeadline}}.'
      - q: Где найти материалы прошлых лет?
        a: 'Программы, фотоотчёты, видео и сборники тезисов конгрессов 2021-2026 годов — в разделе «Архив».'
