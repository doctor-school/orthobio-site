          - https://cdn.congress-ph.online/261/orgs_hum/ochkurenko.jpg
          - https://cdn.congress-ph.online/261/orgs_hum/torgashin.jpg
        description: >-
          11 portraits of the оргкомитет, rescued with Playwright from the LIVE
          orthobio.ru/orgs (the apex still serves the operator's 2026 site; the
          files themselves sit on the operator's CDN cdn.congress-ph.online,
          which is exactly the dependency this rescue removes).

          Originals are 512×512 JPEG, each a circular photo mask of diameter 400
          painted dead centre on a white canvas. Derivatives are 288×288 webp
          (q88, 6.8-11.9 KB) for the 72px PersonCard circle: a FIXED 400×400
          centre crop lifts the inscribed circle out of the white canvas, then a
          resize to 288 — a deterministic transform for the whole set. Automatic
          white-border trim was rejected: on the four portraits shot against a
          near-white background (white coat / bright studio) it ate into the
          circle and shifted the face off centre.

          NO portrait exists for Загородний Н.В. — he has no card on /orgs. The
          only person-shaped file left on the old site is the homepage
          `261/images/human.jpg`, which is the ОРТО wordmark over «2026», not a
          person; it was downloaded, identified, and discarded (not staged, not
          uploaded).

          Consumers: 2026.yaml committee[].photo (11 members), the 2025.yaml
          committee (9 of the same people) and the Страхов М.А. greeting cards
          in 2022/2023/2024/2025.yaml — a portrait is person identity, not a
          year-scoped fact.

          ⚠️ PREFIX SEMANTICS: `2026/people/` records WHERE THE RESCUE RAN (the
          2026 congress site), NOT the year the face belongs to. A person is
          year-independent and five different years' YAML point at these same
          objects. Do NOT re-file the same person under 2027 on the next rescue
          — add missing people here and reuse what already exists. A flat
          `people/` prefix would say this more directly; it was not adopted
          because these objects are already served with an immutable
          year-long Cache-Control, so re-prefixing means re-uploading all 22,
          rewriting the checksums and touching five content files for zero
          user-visible gain (PR #28 review).
        actual_year: 2026
