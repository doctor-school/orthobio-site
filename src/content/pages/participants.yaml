# Участникам (/participants) — ТЗ §4: формы участия и требования к материалам
# VIII конгресса. Источник фактов — ТЗ организаторов «Регистрация участников и
# подача материалов на Конгресс 2027», согласовано владельцем в Issue #108:
# п. 1–2 — подача в личном кабинете, несколько материалов разных типов, тезисы
# не являются заявкой на доклад, возрастной порог постера относится к
# подающему автору; п. 3 — не более 3 тезисов от одного автора; п. 4 —
# дедлайны; п. 6 — требования по типам. Требования и правила конгресса
# 2026 года (формат презентаций, бесплатность и т. п.) сюда не переносятся:
# для 2027 года они не подтверждены.
# Дата старта приёма материалов намеренно не называется: организаторы её не
# зафиксировали («откроется в ближайшее время, о старте сообщим»).
# ⚠️ Про даты и тест: tests/unit/content-dates.test.ts сверяет с
# REGISTRATION_OPENS каждую дату в строке со словом о регистрации, поэтому
# строки о приёме материалов литеральных дат не содержат — только токены.
# Проверка читает и комментарии тоже.

# {{oralTalkDeadline}} и {{posterAbstractDeadline}} — дедлайны из настроек сайта
# (SUBMISSION_DEADLINES в src/config/site.ts, Issue #108), подставляются при
# сборке вместе с «года». Сами даты сюда не пишутся: их меняют в одном месте, и
# следом меняются «Участникам», FAQ и /registration.

title: Участникам
description: 'Формы участия в конгрессе ОРТОБИОЛОГИЯ и требования к материалам. Дедлайны: устные доклады — до {{oralTalkDeadline}}, постеры и тезисы — до {{posterAbstractDeadline}}.'
lead:
  # Дедлайны не дублируются в лиде: они стоят через абзац ниже, в блоке
  # «Приём материалов (2027)», и в поисковом сниппете выше.
  # Формулировка про старт регистрации верна и до, и после дня открытия:
  # страница статическая, а момент деплоя относительно этого дня не известен.
  - Регистрация на VIII конгресс — с 1 октября 2026 года.
  - Ниже — формы участия в VIII конгрессе и требования к материалам.
blocks:
  - kind: text
    heading: Приём материалов (2027)
    paragraphs:
      - 'Приём докладов, тезисов и постеров на VIII конгресс откроется в ближайшее время — о старте сообщим. Дедлайны: устные доклады — до {{oralTalkDeadline}}, постерные доклады и тезисы — до {{posterAbstractDeadline}}.'
      - Материалы подаются в личном кабинете участника — он появляется после регистрации на конгресс. Можно подать несколько материалов разных типов; подача тезисов не является заявкой на доклад.
  - kind: list
    heading: Устный доклад
    items:
      - 'в заявке указываются тема, авторы, место работы, образовательная цель и краткое содержание'
      - формат выступления — очный
  - kind: list
    heading: Постерный доклад
    items:
      - 'в заявке указываются тема, авторы, цель и содержание'
      - постерный доклад может подать автор младше 40 лет
      - правила оформления постера будут направлены дополнительно
  - kind: list
    heading: Тезисы
    items:
      - не более 3 тезисов от одного автора
      - 'в заявке указываются тема, авторы и текст тезисов объёмом до 5000 знаков'
      - 'структура: «Актуальность — Цель — Материалы и методы — Результаты и обсуждение — Выводы»'
      - 'не допускаются таблицы, формулы, рисунки, фотографии и торговые наименования'
      - нужны согласие на публикацию в РИНЦ и подтверждение отсутствия некорректных заимствований
  # «Как подать материалы» (Issue #99): инструкция по кабинету подачи на
  # платформе Doctor.School. Текст утверждён владельцем 2026-10-02 (комментарий
  # «Утверждённый текст инструкции» в Issue #99) и стоит здесь дословно; номера
  # шагов ставит сборка по порядку. Якорь #podat-materialy — постоянный: на него
  # ведёт письмо уже зарегистрированным участникам.
  # Даты — только токены из настроек сайта (src/config/site.ts):
  # {{oralTalkDeadline}} / {{posterAbstractDeadline}} — SUBMISSION_DEADLINES;
  # {{congressStartDay}} — первый день конгресса (UPCOMING_CONGRESS_DATES);
  # {{posterBornFrom}} / {{posterBornUntil}} — границы даты рождения для
  # постеров, считаются из первого дня и POSTER_AGE_LIMIT_YEARS.
  # Шаг 2 «Как войти в кабинет» намеренно без текста (text: null — печатается
  # только заголовок): механика входа перерабатывается, текст шага придёт
  # отдельно. Объявление «приём открыт» и кнопка входа в кабинет в блоке
  # «Приём материалов (2027)» выше — последний шаг запуска, не этот блок.
  # Скриншоты — кабинет на стенде DS Platform (2026-10-05), в бакете под
  # 2027/submissions/ (docs/assets-manifest.yaml, item 2027-submissions-guide).
  - kind: submission-guide
    heading: Как подать материалы на VIII Конгресс «Ортобиология 2027»
    steps:
      - title: Кто может подать материалы
        text: 'Только зарегистрированные участники Конгресса. Если вы ещё не зарегистрированы — «Зарегистрироваться». Принимаются три вида: устный доклад, постерный доклад и тезисы. Можно подать несколько заявок разных видов: устные доклады — до {{oralTalkDeadline}}, постерные доклады и тезисы — до {{posterAbstractDeadline}}, до 23:59 по московскому времени.'
        links:
          - text: «Зарегистрироваться»
            href: /registration
      - title: Как войти в кабинет
        text: null
      - title: Кабинет «Мои заявки на Конгресс»
        text: 'Новая заявка: 1) «+ Новая заявка»; 2) вид — «Устный доклад», «Постерный доклад» или «Тезисы» (под каждым — срок приёма, у тезисов — «Отправлено N тезис из 3»); 3) «Начать заявку →». Вы сразу указаны первым автором (ФИО и место работы — из регистрации). Черновик сохраняется сам: кнопки «Сохранить» нет, вверху «Сохраняем…» → «Сохранено»; можно уйти и вернуться — заявка в списке со статусом «Черновик», «Продолжить →». «Удалить черновик» — без восстановления. Список «Мои заявки»: статус, тема, вид, дата изменения; фильтры «Все», «Черновики», «Отправлены» и др.'
        shots:
          - url: /media/2027/submissions/01-cabinet-empty.png
            alt: 'Кабинет «Мои заявки на Конгресс», блок «Новая заявка»: выбор вида заявки — «Устный доклад», «Постерный доклад» или «Тезисы», у каждого срок приёма и ссылка «Начать заявку», у тезисов — счётчик «Отправлено 0 тезисов из 3»'
            width: 1080
            height: 544
          - url: /media/2027/submissions/11-list-with-statuses.png
            alt: 'Список «Мои заявки» с фильтрами «Все», «Черновики», «Отправлены» и кнопкой «+ Новая заявка»: черновик постерного доклада с действиями «Продолжить» и «Удалить черновик», отправленный устный доклад с действием «Забрать на исправление»'
            width: 1048
            height: 385
      - title: Устный доклад
        text: 'Формат — очный. «Тема» (до 300 знаков); «Авторы» (до 20; «Фамилия», «Имя», «Место работы», «Отчество» — если есть; «+ Добавить автора», «Выше»/«Ниже»; один — «Докладчик»); «Образовательная цель» (до 1 000 знаков); «Краткое содержание» (до 3 000 знаков). По «Отправить» проверяем, что всё заполнено и отмечен ровно один докладчик; иначе — список того, что исправить. Затем вопрос «Отправить заявку в программный комитет?» → «Да, отправить».'
        shots:
          - url: /media/2027/submissions/03-oral-form-authors.png
            alt: 'Форма устного доклада: поле «Тема» и список авторов с отметкой «Докладчик», кнопками перемещения и полями «Фамилия», «Имя», «Отчество», «Место работы» у редактируемого автора; ниже — «+ Добавить автора»'
            width: 808
            height: 698
          - url: /media/2027/submissions/04-oral-form-text.png
            alt: 'Раздел «Содержание» формы устного доклада: поля «Образовательная цель» и «Краткое содержание», согласие на обработку персональных данных, отметка «Сохранено» и кнопка «Отправить»'
            width: 808
            height: 590
          - url: /media/2027/submissions/05-validation-errors.png
            alt: 'Сообщение «Заявка не отправлена. Исправьте 4 ошибки» со списком незаполненных полей, каждый пункт — ссылка на поле'
            width: 808
            height: 366
          - url: /media/2027/submissions/07-submit-confirm.png
            alt: 'Вопрос «Отправить заявку в программный комитет?» с кнопками «Отмена» и «Да, отправить»'
            width: 808
            height: 246
      - title: Постерный доклад
        text: '«Тема»; «Авторы» (без докладчика, порядок — как в публикации); «Цель» (до 1 000); «Содержание» (до 3 000); «Дата рождения» — один раз, запоминаем. Постеры — от участников младше 40 лет на {{congressStartDay}}: родились {{posterBornFrom}} или позже — можно; {{posterBornUntil}} или раньше — нельзя, устные доклады и тезисы доступны. Файлы постеров и правила оформления организаторы пришлют позже.'
        shots:
          - url: /media/2027/submissions/08-poster-birthdate.png
            alt: 'Форма постерного доклада: поле «Тема» и поле «Дата рождения» с пояснением, что её спрашивают один раз, перед первым постером'
            width: 808
            height: 305
          - url: /media/2027/submissions/09-poster-age-refusal.png
            alt: 'Предупреждение в форме постерного доклада: постерные доклады принимают от участников младше 40 лет на дату начала Конгресса, указанная дата рождения не подходит'
            width: 808
            height: 449
      - title: Тезисы
        text: '«Название тезисов»; «Авторы» (порядок публикации); «Текст тезисов» — «Актуальность», «Цель», «Материалы и методы», «Результаты и обсуждение», «Выводы». Всего не больше 5 000 знаков с пробелами, один общий счётчик («4 980 / 5 000»). Только текст — без таблиц, формул, рисунков и фото. Перед отправкой: «В тексте нет некорректных заимствований», «В тексте нет торговых наименований». Не больше 3 тезисов от одного автора: считаются все отправленные, включая отклонённые и отозванные; не считаются черновики и забранные на исправление до начала рассмотрения. Публикацию, в том числе в РИНЦ, покрывает согласие (раздел 7). Тезисы — не заявка на доклад; «Подать тезисы по этой работе» на карточке доклада переносит тему и авторов.'
        shots:
          - url: /media/2027/submissions/10-abstract-form.png
            alt: 'Форма тезисов: пять полей — «Актуальность», «Цель», «Материалы и методы», «Результаты и обсуждение», «Выводы», отметки «В тексте нет некорректных заимствований» и «В тексте нет торговых наименований», общий счётчик знаков из 5 000 и кнопка «Отправить»'
            width: 808
            height: 1039
      - title: Согласие на обработку персональных данных
        text: 'При первой отправке — «Согласие на обработку персональных данных» (полный текст по ссылке). Одно на все виды: содержание заявки, данные соавторов, дата рождения, передача программному комитету и партнёру Конгресса, публикация тезисов.'
        shots:
          - url: /media/2027/submissions/06-consent-and-submit.png
            alt: 'Раздел «Подтверждения»: отмеченное согласие на обработку персональных данных со ссылкой на полный текст и кнопка «Отправить»'
            width: 808
            height: 220
      - title: Сроки
        text: 'До 23:59 МСК включительно: устный доклад — {{oralTalkDeadline}}; постерный доклад и тезисы — {{posterAbstractDeadline}}. После последнего дня черновик можно прочитать, но не отправить.'
      - title: После отправки
        text: 'Письмо «Doctor.School — заявка получена». Статусы: «Отправлена» — ждёт комитет, пока приём открыт, можно «Забрать на исправление»; «На рассмотрении» — править нельзя; «Принята» — придёт письмо; «Отклонена» — письмо с комментарием, он же в кабинете; «На доработке» — 3 рабочих дня до 23:59 МСК, точный срок в письме и кабинете, «Отправить снова» — даже после закрытия общего приёма; «Отозвана» — комитет не рассмотрит. «Отозвать» — пока нет решения; после «Принята»/«Отклонена» — нельзя.'
        shots:
          - url: /media/2027/submissions/12-sent-card-actions.png
            alt: 'Карточка отправленной заявки со статусом «Отправлена» и действиями «Забрать на исправление» и «Подать тезисы по этой работе»'
            width: 1018
            height: 145
      - title: Частые вопросы
        text: 'Приём закрылся, заявка в черновиках — отправить нельзя. Четвёртые тезисы — не больше 3 от автора. Постер не подходит по возрасту — устный доклад и тезисы. Изменить после отправки — пока «Отправлена» и приём открыт: «Забрать на исправление» → исправить → «Отправить»; после начала рассмотрения — только при возврате на доработку. Доклад и тезисы по одной работе — да, две заявки. Несколько заявок — да, устные и постерные без ограничения количества.'
  # «Проживание» (Issue #112). Факты — от отеля через владельца: промокод,
  # сроки, телефоны и почта отдела бронирования. Время пешком от метро здесь не
  # повторяется: оно в карточке площадки на /registration (11 минут, владелец
  # 2026-09-30), а не в тексте отеля. Ссылка на карту берётся из
  # UPCOMING_CONGRESS_VENUE.mapUrl (src/config/site.ts), не отсюда.
  # Промокод в трёх фразах ниже не размечается: сборка сама выделяет его
  # (и почту — ссылкой), а схема падает, если фраза перестала его содержать.
  - kind: accommodation
    heading: Проживание
    lead: Конгресс проходит в отеле «Милан» (Москва, ул. Шипиловская, 28А). Для участников отель предоставляет специальные условия бронирования стандартных номеров по промокоду.
    leadEmphasis: отеле «Милан»
    about: Отель расположен между аэропортом «Домодедово» и центром Москвы, рядом — метро «Домодедовская». Неподалёку музеи-заповедники «Царицыно» и «Коломенское», торговые центры.
    promo:
      label: Промокод для участников
      code: ОРТОБИОЛОГИЯ
