  - 'Сборник «Консенсусы. Ортобиология 2024» — научное издание под редакцией акад. РАН, д.м.н., проф. Н.В. Загороднего и к.м.н. М.А. Страхова (Москва, 2025, 200 с.).'
  - Сборник подготовили МОО «Общество регенеративной травматологии и ортопедии» (ОРТО), Ассоциация травматологов-ортопедов России (АТОР), Медицинская ассоциация специалистов по лечению и изучению остеонекроза (МАПО) и МОО «Общество трансплантологов». Правообладатель — МОО «ОРТО»; сборник предназначен для некоммерческого использования при наличии прямой ссылки на источник.
