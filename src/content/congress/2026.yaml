      - "Компания развивает диверсифицированный портфель из более чем 330 лекарственных препаратов в ТОП-10 сегментов фармацевтического рынка. В портфель Компании входят препараты-блокбастеры и инновационные биотехнологические препараты, не имеющие аналогов на российском рынке. На основе собственных разработок Компания выпускает препараты для лечения социально значимых заболеваний: онкологии, сахарного диабета, ожирения, неврологии, инфекционных заболеваний, ревматологии и др. Более 80 % производимых Компанией продуктов входят в государственный перечень жизненно необходимых и важнейших лекарственных препаратов (ЖНВЛП)."
      - Собственный R&D-центр – ядро прорывных решений в области здравоохранения и основа развития бизнеса Компании. Он включает лаборатории разработки готовых лекарственных средств (биотехнологических и на основе малых молекул) и разработки фармацевтических субстанций, аналитическую лабораторию, службу регистрации, центр координации трансфера на производство, а также службу контроля качества, охватывающую весь цикл от разработки и производства лекарственных препаратов до их потребления.
      - Благодаря собственным инновационным химическим технологиям и биотехнологиям, а также современным производственным мощностям Компания является активным участником системы обеспечения национальной лекарственной безопасности и импортонезависимости страны.
