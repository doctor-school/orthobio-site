# ОРТОБИОЛОГИЯ 2026 — VII конгресс, 24–25 апреля 2026, Москва.
# Sources: docs/recon/orthobio-ru-main.md · docs/assets-manifest.yaml (2026) ·
# staged prog.pdf (committee, стр. 3) · live orthobio.ru/orgs (regalia).
# Media: /media/<s3_key> — root-relative paths mapping 1:1 to the staged
# assets tree / future S3 keys (base-host swap in Issues #4/#5).
# ТЗ §2 ⚠️: the 2026 site's internal contradictions (deadlines главная ≠ /event,
# «8 направлений» НМО with 7 listed) are deliberately NOT carried over.

