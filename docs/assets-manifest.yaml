# ─────────────────────────────────────────────────────────────────────────────
# Partner / organizer logos (Issue #22) — rescued 2026-07-29
#
# Why they are here and not in `years:` above: a logo is a BRAND MARK, not a
# fact about one congress. The library is keyed by organization and one object
# serves every edition that organization took part in — which is what lets the
# 2024/2025 sponsor rosters (whose own archive pages carry no logos at all)
# show a mark. Which year references which object is decided in
# `src/content/congress/<year>.yaml`, not here.
#
# Sources — all JS-rendered, which is why the 2026 recon pass (plain WebFetch,
# docs/recon/orthobio-ru-main.md) reported no logos and archive-2021.md marked
# the logo sources «Сохранять? → нет». Owner reversed that call in Issue #22.
#   https://orthobio.ru/orgs — 5
#   https://orthobio2021.creatium.site/archive/2025 — 13
#   https://orthobio.ru/exhibition — 22
#   https://orthobio.ru/partners — 9
#
# Reproduce the staging tree with `node scripts/rescue-partner-logos.mjs`
# (Playwright; writes <out>/ originals and <out>/web/ derivatives + index.json).
# Local staging lives in a gitignored worktree dir — binaries are NEVER
# committed; the bucket is the durable copy.
#
# `original` = the file as the source site serves it. `object` = what is in
# the bucket: resize to a 240px long side + re-encode, nothing else. No
# recolouring and no background removal — the congress-ph tiles are
# heterogeneous (white knockout marks on the old site's green field alongside
# companies' own logos pasted onto that field), so a blanket "make the
# background transparent" pass would mangle the second group. The originals are
# 512×512 PNGs stored uncompressed (1.03 MB each, 37.3 MiB for the set);
# shipping them unresized would put tens of megabytes on /partners.
#
# `source_alt` = the alt text the source page carries on that mark, captured
# verbatim. It is the only INDEPENDENT evidence that the URL→organization
# binding in scripts/rescue-partner-logos.mjs points at the right company: the
# table itself is hand-authored. 27 of the 49 marks have one and all 27 agree
# with `org` (the crawler now reports any that do not); the remaining 22 —
# the 13 Creatium соорганизаторы and 9 info partners — ship no alt at source,
# so their binding rests on the source URL alone. Recorded here because
# cdn.congress-ph.online will not outlive this site (PR #36 review).
#
# 19 partners across 2021/2024/2025/2026 keep `logo: null` — no mark exists on
# any surviving source (see the per-year comments in the content YAML).
#
# 2026-07-29 (Issue #39) — re-derived, same 49 keys. Issue #22 only downscaled
# each source, so the empty field the source baked in survived into the object:
# a 414px «Берлин-Хеми» wordmark inside a 512px lime tile was painted 58px wide
# in PartnerTier's 120×72 `object-fit: contain` slot, and the creatium
# соорганизатор scans put a small crest in the middle of a 286×120 white
# letterbox. `scripts/retrim-partner-logos.mjs` re-fetches each `source_url`,
# refuses to proceed unless the bytes still match the `original:` block below,
# crops the field down to the mark and leaves a uniform margin (8% of the
# mark's long side, grown by replicating the frame's own edge pixels).
#
# Backgrounds are NOT recoloured: the lime is the operator's house style for
# the partner grid (owner ruling on #39), so it is kept — there is just less of
# it. 47 of the 49 objects changed; the marks they paint grew ×1.07…×2.31.
#
# The pass covers ALL 49 items — there is no colour-based or source-based
# exclusion. The five white 512×512 organizer marks from orthobio.ru/orgs
# (orto, ator, mapo, cito, fnkc-fmba-kafedra) were held back on the first run,
# because the issue as first written said «do not touch the white/transparent
# objects» — a sentence from its earlier shape, when the work was chroma-keying
# the lime away and a white mark had nothing to key. They are in now: they are
# the «Организаторы» tier, the first block on /archive/2026, and leaving them
# out would leave that tier as the one place where the marks are still small.
#
# Only 2 objects stay byte-for-byte: vmeda.jpg and rnch-petrovskogo.jpg, whose
# marks already run to the frame edge, so the uniform ring would make them
# SMALLER in the slot (72px → 62px and 69px → 62px). That is measured, not
# assumed — which is why vmeda is here and not in the issue's hand-written list
# of scans to trim.
#
# `object.w/h` are no longer a uniform 240px long side: a cropped 286×120 scan
# has fewer pixels than that and is not upscaled to fake them. Institutional
# .jpg marks now paint ~62px from a source bbox of ~85–95px and will be slightly
# soft at DPR 2 — that is the whole of what those scans contain. Do NOT «fix»
# it by upscaling; `withoutEnlargement: true` in the script is deliberate.
logos:
  rescued_at: '2026-07-29'
  s3_prefix: 'logos/'
  s3_uploaded_at: '2026-07-29'
  retrimmed_at: '2026-07-29' # Issue #39; 47 of 49 objects re-uploaded in place
  # The encoder that produced the `object.sha256` pins below. Those pins are
  # exact bytes, and exact bytes are only reproducible on the same codec build:
  # a later libvips re-encodes the same pixels differently and every pin will
  # look violated when nothing is wrong. `scripts/retrim-partner-logos.mjs`
  # prints it and writes it to its index.json, so this line is copied, not
  # typed from memory.
  #
  # Both rescues ran on this build, and that is checkable rather than asserted:
  # vmeda.jpg and rnch-petrovskogo.jpg still carry their #22 bytes (this pass
  # left them alone), and re-encoding their sources here with the #22 recipe —
  # resize 240 inside + jpeg quality 88 mozjpeg — reproduces both objects
  # exactly.
  tool: 'sharp 0.35.3 / libvips 8.18.3 (mozjpeg 0826579, libpng 1.6.58)'
  counters:
    objects: 49
    original_bytes: 39136525
