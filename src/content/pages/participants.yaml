# Участникам (/participants) — ТЗ §4: формы участия и требования к материалам
# по образцу /event 2026; окно приёма материалов на 2027 год подтверждено
# владельцем 2026-08-05 (Issue #71).
# Источник фактов: docs/recon/orthobio-ru-main.md, раздел /event (конгресс-2026).
# ⚠️ ТЗ §2: дедлайны сайта-2026 противоречивы (главная 30.01 против /event
# 15.01/28.01/25.02) — НИ ОДНА из этих дат сюда не перенесена: срок 2027 года
# назван владельцем напрямую, а спорные даты прошлого года как ориентир не
# публикуются.
# ⚠️ Про даты и тест: строки об окне приёма материалов намеренно НЕ содержат
# слова «регистрация». tests/unit/content-dates.test.ts сверяет с
# REGISTRATION_OPENS каждую дату в такой строке, а закрытие приёма тезисов —
# не второй срок открытия. Проверка читает и комментарии, поэтому дата и это
# слово не должны стоять в одной строке даже здесь: первая версия этой сноски
# уронила тест на самой себе.

title: Участникам
description: Формы участия в конгрессе ОРТОБИОЛОГИЯ и требования к материалам. Доклады, тезисы и постеры принимаются с 1 октября по 1 декабря 2026 года.
lead:
  # Окно приёма не дублируется в лиде: оно стоит через абзац ниже, в блоке
  # «Приём материалов (2027)», и в поисковом сниппете выше. Три копии одной
  # даты на одном экране читались как настойчивость, а не как факт.
  - Регистрация на VIII конгресс откроется 1 октября 2026 года.
  - Ниже — формы участия и требования к материалам, действовавшие на конгрессе 2026 года. Требования 2027 года будут подтверждены отдельно.
blocks:
  - kind: text
    heading: Приём материалов (2027)
    paragraphs:
      - Доклады, тезисы и постеры на VIII конгресс принимаются с 1 октября по 1 декабря 2026 года.
      - Требования к материалам на 2027 год будут подтверждены отдельно; ниже приведены требования конгресса 2026 года.
  - kind: list
    # Год в заголовке: три соседних блока подписаны «(2026)», а этот при
    # сканировании оглавления читался как формы участия 2027 года
    # (контент-аудит М4).
    heading: Формы участия (2026)
    intro: 'Конгресс 2026 года проводился очно, участие было бесплатным. Формы участия:'
    items:
      - слушатель
      - устный доклад
      - публикация тезисов
      - постерный доклад (электронный)
  - kind: list
    heading: Требования к устным докладам (2026)
    items:
      - формат презентации 16:9, не более 15 слайдов на 10 минут выступления
      - шрифт Arial, файл не более 10 МБ, форматы pptx, ppt, pdf
      - материалы подавались через личный кабинет на платформе регистрации
  - kind: list
    heading: Требования к тезисам (2026)
    items:
      - публикация бесплатная, сборник размещается в РИНЦ
      - объём не более 5000 знаков
      - 'структура: актуальность, цель, материалы и методы, результаты, выводы'
      - таблицы и рисунки не принимались
  - kind: list
    heading: Постеры и конкурс молодых учёных (2026)
    items:
      - постерные доклады принимались от молодых специалистов до 40 лет, отбор проводил научный комитет
      - в конкурсе молодых учёных требовалось указывать источники финансирования исследования
      - лучшие работы включались в программу конгресса, авторы получали дипломы
