# ── Video posters — Issue #33 (2026-07-29) ───────────────────────────────
#
# Poster frames of the 23 archive videos (20 YouTube 2021–2024, 3 Rutube 2025).
# The click-to-load facade (PR #30) drew a bare dark plate because hotlinking
# i.ytimg.com / Rutube's CDN is out under the media rule; these are our own
# copies of the same frames, so the rule holds and the cards show real previews.
#
# Reproduce with `node scripts/rescue-video-posters.mjs` (add `--upload` to PUT
# to S3; credentials by env var NAME only — infra/terraform/README.md). The
# script reads the video list out of src/content/congress/*.yaml, so it stays
# correct when a year gains a video.
#
# `source` = the exact frame the provider served. YouTube publishes a ladder
# (maxresdefault → hq720 → sddefault → hqdefault) and a missing rung answers 404
# with a grey placeholder, so the script takes the best rung that returns HTTP
# 200: 21 of 23 posters come from a 1280×720-or-larger frame, `yt-c-RvCZ2GPKM`
# only has sddefault (640×480) and `yt-EmXZXKUpxiY` only hqdefault (480×360).
# Rutube publishes no predictable thumbnail path — the frame URL comes from its
# public video API (`https://rutube.ru/api/video/<id>/` → thumbnail_url).
#
# `object` = what the bucket holds: centre-cropped to 16:9 (which is what
# removes the black bars of the 4:3 YouTube rungs), downscaled to at most 800px
# wide (≈ a 390px card slot at 2×, never upscaled — hence the two smaller
# objects) and re-encoded to WebP q78. No recolouring, no overlays.
#
# `poster-yt-a0oU5_WYvSI` and `poster-yt-YMJQy8s-kTM` are byte-identical: the
# 2023 day-1 and day-2 streams were published under the same custom thumbnail.
# Two objects, on purpose — a poster is keyed by the VIDEO, so the mapping stays
# reproducible from the YAML rather than depending on a dedup table.
#
# 23 of 23 videos have a poster; nothing is `not-found`. The `poster: null`
# branch in the schema and the bare-plate fallback in VideoCard are kept for the
# video that one day has none.

