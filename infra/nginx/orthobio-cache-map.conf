# Cache tiers shared by the preview and production vhosts.
#
# This file is installed into /etc/nginx/conf.d, which nginx includes at http
# scope. A map cannot live inside server {}, and defining the same output
# variable in both vhost files would make nginx reject the second definition.
#
# Keep the policy here rather than in per-location `add_header` directives:
# add_header inside a location replaces inherited security headers.
map $uri $orthobio_cache {
    # HTML documents: revalidate every time so a redeploy is visible at once.
    default                        "public, max-age=0, must-revalidate";
    # Astro content-hashed assets: the hash pins the bytes, cache forever.
    ~^/_astro/                     "public, max-age=31536000, immutable";
    # Stable-named assets keep their names across deploys.
    ~*\.(png|jpe?g|svg|webp|avif|ico|woff2?|webmanifest|xml|txt)$  "public, max-age=3600";
}
