# НМО (/nmo) — ТЗ §4: общий принцип + честная пометка, что детали 2027 позже.
# Источник фактов: docs/recon/orthobio-ru-main.md, раздел /nmo (конгресс-2026).
# ⚠️ ТЗ §2: сайт-2026 заявляет «8 направлений», а перечисляет 7 — противоречие
# НЕ переносим: перечислены ровно те 7 специальностей, что были на сайте.

title: НМО
description: Баллы НМО на конгрессе ОРТОБИОЛОГИЯ. Условия аккредитации 2027 года будут объявлены.
lead:
  - Баллы НМО на конгрессе начисляются. Условия аккредитации 2027 года — количество баллов, перечень специальностей и порядок учёта — будут объявлены после открытия регистрации в ноябре 2026 года.
blocks:
  - kind: text
    heading: Как это было на конгрессе 2026 года
    paragraphs:
      - Участникам VII конгресса начислялось 6 баллов НМО за день участия, максимум 12 баллов за два дня.
      - Данные ниже описывают конгресс 2026 года и приведены для ориентира; на 2027 год они не переносятся автоматически.
  - kind: list
    heading: Специальности (2026)
    intro: 'Программа 2026 года была аккредитована по специальностям:'
    items:
      - детская хирургия
      - лечебная физкультура и спортивная медицина
      - неврология
      - ревматология
      - травматология и ортопедия
      - физическая и реабилитационная медицина
      - хирургия
  - kind: list
    heading: Как учитывалось участие (2026)
    items:
      - бейджи со штрихкодами, отметки до и после сессий
      - сателлитные симпозиумы фармкомпаний баллами НМО не обеспечивались
      - сертификаты направлялись на электронную почту в течение 20 рабочих дней после конгресса
