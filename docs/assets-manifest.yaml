# Assets rescue manifest — Congress ОРТОБИОЛОГИЯ archive 2021–2026 (Issue #2)
#
# Four sections, four rescues, each with its own counters and header:
#   years:         the Issue #2 photo/PDF/video sweep (2026-07-27), below;
#   logos:         the Issue #22 partner-logo library (2026-07-29), 49 objects;
#   profiles:      the Issue #24 company-profile rescue (2026-07-29) — TEXT
#                  only, zero objects uploaded, reason recorded there;
#   video_posters: the Issue #33 poster frames (2026-07-29), 23 objects.
#
# Rescued on 2026-07-27 from seven external platforms before link rot.
# Local staging: C:\Users\sidor\orthobio-assets\<year>\... (outside the repo;
# binaries are NEVER committed to git).
#
# S3 status: uploaded (2026-07-27, owner-authorized provisioning).
#   Dedicated bucket `orthobio-media` provisioned via infra/terraform/ (Timeweb
#   Cloud, ds-platform project, S3 Hot v2 10GB preset) — see
#   infra/terraform/README.md for the apply/upload runbook. The earlier survey
#   note stands: the bbm-public-website CDN-origin bucket runs a nightly
#   `aws s3 sync --delete` prune and CANNOT host orthobio assets.
#   Upload: staging tree synced 1:1 (local path <year>/... = S3 key
#   <year>/...), skipping the 3 byte-duplicate 2021/previews files; all
#   objects carry Cache-Control: public, max-age=31536000, immutable.
#   Env var names (values host-side only): TIMEWEB_S3_ACCESS_KEY,
#   TIMEWEB_S3_SECRET_KEY, TIMEWEB_S3_ENDPOINT, TIMEWEB_S3_BUCKET,
#   TIMEWEB_S3_REGION.
#
# Statuses:
#   downloaded — files on disk under staging_root (local path set)
#   recorded   — provenance-only item (URLs/content captured, nothing on disk;
#                local is null by design)
#   not-found  — the asset does not exist / source dead
#   owner-step — blocked on the owner (auth, money, accounts)
#   at-risk    — external asset outside this issue's scope, NOT yet rescued;
#                listed so the manifest stays the single answer to "what is
#                still hostage to external operators"
# (s3_key values are the LIVE object keys in the orthobio-media bucket;
# public URL = <s3_public_base_url><s3_key>.)
#
# Integrity: docs/assets-checksums.txt = SHA-256 of every staged file
# (2244 lines, "hash  <relative path>", sorted). Verify tree or the future
# S3 upload object-by-object against it.
#
# 2026-07-29 (Issue #23): +22 objects — the 11 оргкомитет portraits rescued
# from the LIVE orthobio.ru/orgs (originals + 288×288 square derivatives),
# see item 2026-committee-portraits. This is the first rescue run after the
# 2026-07-27 sweep; every other number in this file still describes that sweep.
#
# 2026-07-29 (Issue #39): 47 of the 49 `logos:` objects REPLACED IN PLACE —
# same keys, same count, new bytes (re-cropped so the mark fills the card
# slot). Object totals moved, `s3_objects*` did not. See the `logos:` header.
# Objects carry `Cache-Control: immutable` and the keys did not change, so the
# replacement is invisible to anything that already cached them until the TTL
# runs out — see infra/terraform/README.md → «Replacing an object in place».
#
# ⚠️ Year attribution: the Google Drive folders «15 апреля»/«16 апреля»
# (1MaNlskHjkZpxm9XzYkgSky-Jfb2o3xGK / 1fJ5BoMr1Tc2jPPDFpNQ6jDk5eSzmryN1)
# contain photos of the 2022 congress (15–16.04.2022) but were copy-pasted onto
# the 2023/2024/2025 archive pages. They are attributed here to 2022 ONLY.

