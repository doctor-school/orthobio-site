# ── Company profiles — Issue #24 (2026-07-29) ───────────────────────────────
#
# The 22 exhibitor profile pages of the 2026 site, `orthobio.ru/company?i=<id>`.
# Reproduce with `node scripts/rescue-partner-profiles.mjs` (Playwright: the
# /exhibition catalogue renders its «Подробнее…» links from JS, so the URLs
# cannot be enumerated from plain HTML).
#
# THIS SECTION UPLOADED NOTHING. It is the first rescue in this repo whose
# payload is entirely TEXT: the captured content (address, phone, email, site,
# description) lives in `src/content/congress/2026.yaml`, which is the durable
# copy. Every item is therefore `status: recorded` — provenance-only, `local`
# null by design, per the status vocabulary at the top of this file.
#
# ── Why no poster or video objects ──────────────────────────────────────────
# Each profile page ships modal markup for three posters
# (`.../exhib/<id>/poster1..3.jpg`) and one video (`.../exhib/<id>/video.mp4`).
# That markup is an unconditional server-side TEMPLATE, not evidence of an
# asset: the `.model` block that would hold the buttons opening those modals is
# EMPTY on all 22 pages, and every one of the 66 poster URLs and 22 video URLs
# returns HTTP 404 from cdn.congress-ph.online. The same CDN directory serves
# each company's `logo.png` with HTTP 200 (rescued in Issue #22), which is what
# proves the 404s are genuine absence rather than a blocked crawl.
#
# So `posters`/`video` below record what the page DECLARED against what could
# be retrieved (always 0), and the recon line «изображения-постеры» in
# docs/recon/orthobio-ru-main.md describes markup, not files.
#
# The 9 info partners and the 21 organizing bodies had no profile pages at all —
# only the 22 exhibitors did, so only they carry a `slug` in the content YAML.
