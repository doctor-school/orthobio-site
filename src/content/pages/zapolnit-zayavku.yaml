# «Как заполнить заявку» (/participants/zapolnit-zayavku) — шаги в кабинете
# подачи материалов, отдельной страницей (владелец 2026-10-07, Issue #99): одна
# инструкция — одна задача. Сюда ведут кнопка в конце «Как подать материалы» на
# /participants и карточка успешной регистрации (#116); старая ссылка
# /participants#zapolnit-zayavku пересылается сюда скриптом на /participants.
# Про вход — только одна строка вверху со ссылкой на «Как подать материалы»:
# читатель здесь, как правило, уже в кабинете.
# Даты — только токены из настроек сайта (src/config/site.ts):
# {{oralTalkDeadline}} / {{posterAbstractDeadline}} — SUBMISSION_DEADLINES;
# {{congressStartDay}} — первый день конгресса (UPCOMING_CONGRESS_DATES);
# {{posterBornFrom}} / {{posterBornUntil}} — границы даты рождения для
# постеров, считаются из первого дня и POSTER_AGE_LIMIT_YEARS.
# Скриншоты — кабинет на стенде DS Platform (2026-10-05), в бакете под
# 2027/submissions/ (docs/assets-manifest.yaml, item 2027-submissions-guide).
#
# Как писать (владелец 2026-10-08, «сплошная простыня»): одно действие — одна
# строка. Последовательность — `steps` (нумерованный список), факты — `bullets`,
# абзац — не длиннее трёх предложений, длинный шаг делится `subheading`.
# «Ёлочки» в тексте инструкции — только для названий в кабинете (кнопки, поля,
# статусы, темы писем): сборка выделяет их одним стилем. Текст говорит с
# читателем о том, что он делает, видит или получает, — не о том, что
# решают или присылают организаторы. Скриншот стоит под тем действием,
# которое показывает.

title: Как заполнить заявку
description: 'Как заполнить заявку на доклад, постер или тезисы VIII конгресса ОРТОБИОЛОГИЯ в личном кабинете: виды заявок, поля, сроки и статусы.'
blocks:
  # Разделы 3–10 прежней инструкции, с их скриншотами, под номерами 1–8; входа
  # здесь нет. Шаги — #zapolnit-zayavku-1 … -8. Факты — утверждённого текста
  # (Issue #99); 2026-10-08 он разложен на списки без изменения смысла.
  # Шаги 7 и 8: «пока приём открыт» заменено датами (владелец 2026-10-05,
  # вслед за кабинетом, ds-platform #2573: срок «Забрать на исправление» —
  # окончание приёма своего вида). В «Тезисах» ссылка «(раздел 5)» — на
  # «Согласие» после перенумерации (было «раздел 7»).
  - kind: submission-guide
    anchor: zapolnit-zayavku
    # Заголовок блока — это <h1> страницы (title выше), второй не нужен.
    heading: null
    intro:
      text: 'Заявку заполняют в личном кабинете. Если вы ещё не вошли — как войти в кабинет.'
      links:
        - text: как войти в кабинет
          href: /participants#podat-materialy
    steps:
      - title: Кабинет «Мои заявки на Конгресс»
        body:
          - kind: subheading
            text: Новая заявка
          - kind: steps
            items:
              - 'Нажмите «+ Новая заявка».'
              - 'Выберите вид: «Устный доклад», «Постерный доклад» или «Тезисы». Под каждым видом указан срок приёма, у тезисов — счётчик «Отправлено N тезис из 3».'
              - 'Нажмите «Начать заявку →».'
          - kind: paragraph
            text: 'Вы сразу указаны первым автором: ФИО и место работы подставляются из регистрации.'
          - kind: shots
            shots:
              - url: /media/2027/submissions/01-cabinet-empty.png
                alt: 'Кабинет «Мои заявки на Конгресс», блок «Новая заявка»: выбор вида заявки — «Устный доклад», «Постерный доклад» или «Тезисы», у каждого срок приёма и ссылка «Начать заявку», у тезисов — счётчик «Отправлено 0 тезисов из 3»'
                width: 1080
                height: 544
          - kind: subheading
            text: Черновик
          - kind: bullets
            items:
              - 'Черновик сохраняется сам — кнопки «Сохранить» нет. Вверху видно «Сохраняем…», затем «Сохранено».'
              - 'Можно уйти и вернуться: заявка останется в списке со статусом «Черновик» и кнопкой «Продолжить →».'
              - '«Удалить черновик» удаляет его без восстановления.'
          - kind: subheading
            text: Список заявок
          - kind: bullets
            items:
              - 'У каждой заявки в списке — статус, тема, вид и дата изменения.'
              - 'Фильтры: «Все», «Черновики», «Отправлены» и другие.'
          - kind: shots
            shots:
              - url: /media/2027/submissions/11-list-with-statuses-v2.png
                alt: 'Список «Мои заявки» с фильтрами «Все», «Черновики», «Отправлены» и кнопкой «+ Новая заявка»: черновик постерного доклада с действиями «Продолжить» и «Удалить черновик», отправленный устный доклад со сроком исправления и действиями «Забрать на исправление» и «Подать тезисы по этой работе»'
                width: 1048
                height: 385
      - title: Устный доклад
        body:
          - kind: paragraph
            text: Формат выступления — очный.
          - kind: subheading
            text: Поля заявки
          - kind: bullets
            items:
              - '«Тема» — до 300 знаков.'
              - '«Авторы» — до 20 человек. У каждого: «Фамилия», «Имя», «Место работы» и «Отчество», если есть.'
              - 'Добавить автора — «+ Добавить автора», изменить порядок — «Выше» и «Ниже». Одного автора отметьте как «Докладчик».'
              - '«Образовательная цель» — до 1 000 знаков.'
              - '«Краткое содержание» — до 3 000 знаков.'
          - kind: shots
            shots:
              - url: /media/2027/submissions/03-oral-form-authors.png
                alt: 'Форма устного доклада: поле «Тема» и список авторов с отметкой «Докладчик», кнопками перемещения и полями «Фамилия», «Имя», «Отчество», «Место работы» у редактируемого автора; ниже — «+ Добавить автора»'
                width: 808
                height: 698
              - url: /media/2027/submissions/04-oral-form-text.png
                alt: 'Раздел «Содержание» формы устного доклада: поля «Образовательная цель» и «Краткое содержание», согласие на обработку персональных данных, отметка «Сохранено» и кнопка «Отправить»'
                width: 808
                height: 590
          - kind: subheading
            text: Отправка
          - kind: steps
            items:
              - text: 'Нажмите «Отправить». Кабинет проверит, что все поля заполнены и докладчик отмечен ровно один. Если нет — появится список того, что исправить.'
                shots:
                  - url: /media/2027/submissions/05-validation-errors.png
                    alt: 'Сообщение «Заявка не отправлена. Исправьте 4 ошибки» со списком незаполненных полей, каждый пункт — ссылка на поле'
                    width: 808
                    height: 366
              - text: 'На вопрос «Отправить заявку в программный комитет?» ответьте «Да, отправить».'
                shots:
                  - url: /media/2027/submissions/07-submit-confirm-v2.png
                    alt: 'Отмеченное согласие на обработку персональных данных и вопрос «Отправить заявку в программный комитет?»: после отправки редактирование закроется, до срока заявку можно забрать на исправление; кнопки «Отмена» и «Да, отправить»'
                    width: 808
                    height: 267
      - title: Постерный доклад
        body:
          # Файл и правила оформления — как в ТЗ п. 6: файлов форма не
          # принимает (046 EARS-18); правила появятся на сайте (владелец
          # 2026-10-08: сайт говорит о том, что видит читатель).
          - kind: note
            paragraphs:
              - Файл постера сейчас прикладывать не нужно — правила оформления постера появятся на сайте позже.
          - kind: subheading
            text: Поля заявки
          - kind: bullets
            items:
              - '«Тема».'
              - '«Авторы» — без докладчика, в порядке, как в публикации.'
              - '«Цель» — до 1 000 знаков.'
              - '«Содержание» — до 3 000 знаков.'
              - '«Дата рождения» — спрашивается один раз и запоминается.'
          - kind: shots
            shots:
              - url: /media/2027/submissions/08-poster-birthdate.png
                alt: 'Форма постерного доклада: поле «Тема» и поле «Дата рождения» с пояснением, что её спрашивают один раз, перед первым постером'
                width: 808
                height: 305
          - kind: subheading
            text: Возраст
          - kind: paragraph
            text: 'Постеры принимают от участников младше 40 лет на {{congressStartDay}}:'
          - kind: bullets
            items:
              - 'родились {{posterBornFrom}} или позже — можно;'
              - 'родились {{posterBornUntil}} или раньше — нельзя, но доступны устные доклады и тезисы.'
          - kind: shots
            shots:
              - url: /media/2027/submissions/09-poster-age-refusal.png
                alt: 'Предупреждение в форме постерного доклада: постерные доклады принимают от участников младше 40 лет на дату начала Конгресса, указанная дата рождения не подходит'
                width: 808
                height: 449
      - title: Тезисы
        body:
          - kind: subheading
            text: Поля заявки
          - kind: bullets
            items:
              - '«Название тезисов».'
              - '«Авторы» — в порядке публикации.'
              - '«Текст тезисов» — пять частей: «Актуальность», «Цель», «Материалы и методы», «Результаты и обсуждение», «Выводы».'
          - kind: subheading
            text: Объём и оформление
          - kind: bullets
            items:
              - 'Всего не больше 5 000 знаков с пробелами — один общий счётчик, например «4 980 / 5 000».'
              - Только текст — без таблиц, формул, рисунков и фото.
          - kind: paragraph
            text: 'Перед отправкой отметьте оба пункта:'
          - kind: bullets
            items:
              - '«В тексте нет некорректных заимствований»;'
              - '«В тексте нет торговых наименований».'
          - kind: shots
            shots:
              - url: /media/2027/submissions/10-abstract-form.png
                alt: 'Форма тезисов: пять полей — «Актуальность», «Цель», «Материалы и методы», «Результаты и обсуждение», «Выводы», отметки «В тексте нет некорректных заимствований» и «В тексте нет торговых наименований», общий счётчик знаков из 5 000 и кнопка «Отправить»'
                width: 808
                height: 1039
          - kind: subheading
            text: Не больше 3 тезисов от одного автора
          - kind: bullets
            items:
              - Считаются все отправленные тезисы, включая отклонённые и отозванные.
              - Не считаются черновики и тезисы, забранные на исправление до начала рассмотрения.
          - kind: subheading
            text: Публикация и доклад
          - kind: bullets
            items:
              - 'Публикацию, в том числе в РИНЦ, покрывает согласие (раздел 5).'
              - 'Тезисы — не заявка на доклад. Кнопка «Подать тезисы по этой работе» на карточке доклада переносит в тезисы тему и авторов.'
      - title: Согласие на обработку персональных данных
        body:
          - kind: paragraph
            text: 'При первой отправке отметьте «Согласие на обработку персональных данных» — полный текст открывается по ссылке.'
          - kind: paragraph
            text: 'Согласие одно на все виды заявок. Оно охватывает:'
          - kind: bullets
            items:
              - содержание заявки;
              - данные соавторов;
              - дату рождения;
              - передачу программному комитету и партнёру Конгресса;
              - публикацию тезисов.
          - kind: shots
            shots:
              - url: /media/2027/submissions/06-consent-and-submit.png
                alt: 'Раздел «Подтверждения»: отмеченное согласие на обработку персональных данных со ссылкой на полный текст и кнопка «Отправить»'
                width: 808
                height: 220
      - title: Сроки
        body:
          - kind: paragraph
            text: 'Заявку можно отправить до 23:59 МСК включительно:'
          - kind: bullets
            items:
              - 'устный доклад — {{oralTalkDeadline}};'
              - 'постерный доклад и тезисы — {{posterAbstractDeadline}}.'
          - kind: paragraph
            text: После последнего дня черновик можно прочитать, но не отправить.
      - title: После отправки
        body:
          - kind: paragraph
            text: 'Вам придёт письмо «Doctor.School — заявка получена».'
          - kind: subheading
            text: Статусы заявки
          - kind: bullets
            items:
              - text: '«Отправлена» — ждёт рассмотрения. До окончания приёма своего вида можно «Забрать на исправление»: устные доклады — до {{oralTalkDeadline}}, постерные доклады и тезисы — до {{posterAbstractDeadline}}.'
                shots:
                  - url: /media/2027/submissions/12-sent-card-actions-v2.png
                    alt: 'Карточка отправленной заявки со статусом «Отправлена», датой отправки и сроком исправления, действиями «Забрать на исправление» и «Подать тезисы по этой работе»'
                    width: 1018
                    height: 125
              - '«На рассмотрении» — править нельзя.'
              - '«Принята» — вам придёт письмо.'
              - '«Отклонена» — вам придёт письмо с комментарием, он же есть в кабинете.'
              - '«На доработке» — на исправление 3 рабочих дня до 23:59 МСК, точный срок — в письме и в кабинете. «Отправить снова» работает даже после закрытия общего приёма.'
              - '«Отозвана» — заявка не будет рассмотрена.'
          - kind: paragraph
            text: '«Отозвать» заявку можно, пока по ней нет решения. После статуса «Принята» или «Отклонена» — нельзя.'
      - title: Частые вопросы
        body:
          - kind: faq
            items:
              - q: Приём закрылся, а заявка осталась в черновиках. Можно её отправить?
                a: Нет — после окончания приёма черновик отправить нельзя.
              - q: Можно подать четвёртые тезисы?
                a: Нет — не больше 3 тезисов от одного автора.
              - q: Постер не подходит по возрасту. Что можно подать?
                a: Устный доклад и тезисы.
              - q: Можно изменить заявку после отправки?
                a: 'Да, пока заявка «Отправлена» и приём своего вида не закончился (устные доклады — до {{oralTalkDeadline}}, постерные доклады и тезисы — до {{posterAbstractDeadline}}). Нажмите «Забрать на исправление», исправьте и снова нажмите «Отправить». После начала рассмотрения — только если заявку вернут на доработку.'
              - q: Можно подать доклад и тезисы по одной работе?
                a: Да, это две отдельные заявки.
              - q: Можно подать несколько заявок?
                a: Да. Устных и постерных докладов — без ограничения количества.
