      - Ортопедические электреты - российская разработка компании «МЕДЭЛ», сделаны из тантала, обеспечивают адекватные режимы электростимуляции, создавая в тканях, поражённых дегенеративно-дистрофическими изменениями, нормальный электрофизиологический фон и способствуя активизации восстановительных процессов остео- и хондрогенеза. Электреты применяются для лечения болезни Пертеса у детей, коксартроза/гонартроза у взрослых, в целях продления функциональных возможностей суставов.
