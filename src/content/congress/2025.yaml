      time: "09:00-09:30"
      hall: "Зал 2"
      moderators:
        - "Котенко Константин Валентинович"
        - "Загородний Николай Васильевич"
        - "Назаренко Антон Герасимович"
      talks: []
    - title: "Нейроортопедия (Вертебрология)"
      date: "2025-04-18"
      time: "09:30-11:00"
      hall: "Зал 2"
      moderators:
        - "Колесов Сергей Васильевич"
        - "Ветрилэ Марчел Степанович"
        - "Арьков Владимир Владимирович"
      talks:
        - title: "Регенеративная медицина в лечении грыж межпозвонковых дисков"
          speakers:
            - "Каландари Алик Амиранович"
        - title: "Поясничный миофасциальный болевой симптом. Комплексный двухэтапный подход"
          speakers:
            - "Кононир Николай Николаевич"
