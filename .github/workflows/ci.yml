name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The deploy workflow gates on THIS workflow's conclusion, so a superseded run
# must not be cancelled on main — only in-flight PR pushes are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # No version input: action-setup@v6 resolves pnpm from the
      # packageManager field in package.json (single source of truth).
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The committed nginx snippet is what a reviewer reads; regenerate it and
      # fail on any diff so it can never drift from infra/redirects.yaml.
      - name: Redirect snippet is up to date
        run: |
          pnpm redirects:build
          git diff --exit-code -- infra/nginx/redirects.generated.conf

      # Builds the production output the e2e suite then serves. Remote archive
      # images are fetched from the Timeweb bucket and optimised here, so a
      # broken media URL fails the build rather than the live site.
      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (responsive + a11y gate)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
