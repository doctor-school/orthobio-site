# ОРТОБИОЛОГИЯ-2027 — static vhost on tools-prod-tw (Issue #5).
#
# Installed at /etc/nginx/sites-available/new.orthobio.ru and symlinked into
# sites-enabled by `infra/host/provision.sh`.
#
# TLS is live: `certbot --nginx -d new.orthobio.ru --redirect` issued the
# certificate on 2026-07-27 (expires 2026-10-25, renewed by the host's existing
# certbot.timer). Certbot rewrote this file in place — it moved the site onto
# 443 and appended the port-80 redirect server below. Those lines are reproduced
# here verbatim, each still carrying its `# managed by Certbot` marker, so the
# repo and the host do not drift: an edit here plus a re-provision keeps TLS,
# instead of silently reverting the vhost to HTTP-only.
#
# RENEWALS DO NOT TOUCH THIS FILE — only `certbot --nginx` rewrites it. If it is
# ever re-run (new hostname at the switchover, say), re-read the host copy and
# reconcile again rather than assuming these lines are still current.
#
# Serves the Astro static build. Note which media this means: archive PHOTOS are
# fetched from the Timeweb S3 bucket `orthobio-media` at BUILD time and shipped
# from here as content-hashed `/_astro/*` — so they are cached by the immutable
# tier below, not by the bucket. Only the linked PDFs are hotlinked from S3 and
# never touch this server.

# Cache tiers as a map rather than per-location `add_header`: an `add_header`
# inside a location REPLACES every inherited header, so a per-location cache
# tier would silently drop the security headers below. One map + one set of
# server-level headers keeps both correct.
map $uri $orthobio_cache {
    # HTML documents: revalidate every time so a redeploy is visible at once.
    default                        "public, max-age=0, must-revalidate";
    # Astro content-hashed assets: the hash pins the bytes, cache forever.
    ~^/_astro/                     "public, max-age=31536000, immutable";
    # Stable-named assets (favicons, og-image): they keep their names across
    # deploys, so an immutable year would strand a stale copy.
    ~*\.(png|jpe?g|svg|webp|avif|ico|woff2?|webmanifest|xml|txt)$  "public, max-age=3600";
}

server {
    server_name new.orthobio.ru;

    root /var/www/new.orthobio.ru/public;
    index index.html;

    access_log /var/log/nginx/new.orthobio.ru.access.log;
    error_log  /var/log/nginx/new.orthobio.ru.error.log;

    add_header Cache-Control $orthobio_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Focused CSP for a static site: block embedding, plugin documents and form
    # submission without weakening the inline module that powers video facades.
    # A broad default-src policy would need unsafe-inline and would therefore
    # claim more protection than it actually provides.
    add_header Content-Security-Policy "base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Frame-Options DENY always;
    # TEMPORARY-URL ONLY. orthobio.ru still serves the previous site; letting
    # search engines index this copy would put two near-identical sites in the
    # index. Remove this line at the domain switchover (Issue #6).
    #
    # Not guarded by prose alone: the deploy workflow asserts the live header
    # against the SITE_INDEXABLE repo Variable, so flipping that Variable to
    # `true` at the switchover FAILS every deploy until this line is actually
    # gone — and forgetting the Variable fails the deploy the other way round.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # One day, and deliberately never `preload`: this hostname is retired at the
    # November migration, and a preloaded or year-long pin outlives the site
    # that set it — browsers would keep forcing HTTPS on a name we no longer
    # control. A day is long enough to matter for a returning visitor.
    add_header Strict-Transport-Security "max-age=86400" always;

    # Redirect map, generated from infra/redirects.yaml and installed by
    # `orthobio-apply-redirects` on the host. `location =` / `location ^~`
    # blocks inside outrank the `location /` below, so a redirect always wins
    # over a file that still exists in the build.
    include /etc/nginx/snippets/orthobio-redirects.conf;

    # Preserve the missing route's 404 status while serving the branded Astro
    # document instead of nginx's generic English error page.
    error_page 404 /404.html;

    location / {
        # Astro's directory build format: /program -> /program/index.html.
        # The $uri.html arm keeps any file-format page reachable too.
        try_files $uri $uri/ $uri.html =404;
    }

    # Never serve dotfiles that a botched sync could leave in the root.
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/new.orthobio.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/new.orthobio.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = new.orthobio.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name new.orthobio.ru;
    return 404; # managed by Certbot


}
