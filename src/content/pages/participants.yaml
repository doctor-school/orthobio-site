# Участникам (/participants) — ТЗ §4: формы участия и требования к материалам
# VIII конгресса. Источник фактов — ТЗ организаторов «Регистрация участников и
# подача материалов на Конгресс 2027», согласовано владельцем в Issue #108:
# п. 1–2 — подача в личном кабинете, несколько материалов разных типов, тезисы
# не являются заявкой на доклад, возрастной порог постера относится к
# подающему автору; п. 3 — не более 3 тезисов от одного автора; п. 4 —
# дедлайны; п. 6 — требования по типам. Требования и правила конгресса
# 2026 года (формат презентаций, бесплатность и т. п.) сюда не переносятся:
# для 2027 года они не подтверждены.
# Дата старта приёма материалов намеренно не называется: организаторы её не
# зафиксировали («откроется в ближайшее время, о старте сообщим»).
# ⚠️ Про даты и тест: tests/unit/content-dates.test.ts сверяет с
# REGISTRATION_OPENS каждую дату в строке со словом о регистрации, поэтому
# строки о приёме материалов литеральных дат не содержат — только токены.
# Проверка читает и комментарии тоже.

# {{oralTalkDeadline}} и {{posterAbstractDeadline}} — дедлайны из настроек сайта
# (SUBMISSION_DEADLINES в src/config/site.ts, Issue #108), подставляются при
# сборке вместе с «года». Сами даты сюда не пишутся: их меняют в одном месте, и
# следом меняются «Участникам», FAQ и /registration.

title: Участникам
description: 'Формы участия в конгрессе ОРТОБИОЛОГИЯ и требования к материалам. Дедлайны: устные доклады — до {{oralTalkDeadline}}, постеры и тезисы — до {{posterAbstractDeadline}}.'
lead:
  # Дедлайны не дублируются в лиде: они стоят через абзац ниже, в блоке
  # «Приём материалов (2027)», и в поисковом сниппете выше.
  # Регистрация открыта с REGISTRATION_OPENS (окно в src/config/site.ts);
  # дата закрытия сюда не пишется — она на /registration.
  - Регистрация на VIII конгресс открыта.
  - Ниже — формы участия в VIII конгрессе и требования к материалам.
blocks:
  - kind: text
    heading: Приём материалов (2027)
    paragraphs:
      - 'Приём докладов, тезисов и постеров на VIII конгресс откроется в ближайшее время — о старте сообщим. Дедлайны: устные доклады — до {{oralTalkDeadline}}, постерные доклады и тезисы — до {{posterAbstractDeadline}}.'
      - Материалы подаются в личном кабинете участника — он появляется после регистрации на конгресс. Можно подать несколько материалов разных типов; подача тезисов не является заявкой на доклад.
  - kind: list
    heading: Устный доклад
    items:
      - 'в заявке указываются тема, авторы, место работы, образовательная цель и краткое содержание'
      - формат выступления — очный
  - kind: list
    heading: Постерный доклад
    items:
      - 'постерный доклад подаётся в кабинете: тема, авторы, цель и содержание'
      - 'постерный доклад может подать автор младше 40 лет на день открытия конгресса — {{congressStartDay}}'
      # Файлов форма не принимает (ds-platform 046 EARS-18); правила оформления
      # организаторы пришлют нам — читателю сайт говорит, где они появятся
      # (владелец 2026-10-08).
      - файл постера сейчас прикладывать не нужно — правила оформления появятся на этой странице позже
  - kind: list
    heading: Тезисы
    items:
      - не более 3 тезисов от одного автора
      - 'в заявке указываются название тезисов, авторы и текст до 5000 знаков с пробелами'
      - 'структура: «Актуальность — Цель — Материалы и методы — Результаты и обсуждение — Выводы»'
      - 'не допускаются таблицы, формулы, рисунки, фотографии и торговые наименования'
      # Как в кабинете (ds-platform 046): две отметки перед отправкой, отдельного
      # согласия на РИНЦ нет — публикацию покрывает согласие на обработку данных.
      - 'перед отправкой подтверждаются отсутствие некорректных заимствований и торговых наименований; публикацию тезисов, в том числе в РИНЦ, покрывает согласие на обработку персональных данных'
  # «Как подать материалы» (Issue #99): инструкция по кабинету подачи на
  # платформе Doctor.School. Текст утверждён владельцем 2026-10-02 (комментарий
  # «Утверждённый текст инструкции» в Issue #99) и стоит здесь дословно; номера
  # шагов ставит сборка по порядку. Якорь #podat-materialy — постоянный: на него
  # ведёт письмо уже зарегистрированным участникам.
  # Даты — только токены из настроек сайта (src/config/site.ts):
  # {{oralTalkDeadline}} / {{posterAbstractDeadline}} — SUBMISSION_DEADLINES;
  # {{congressStartDay}} — первый день конгресса (UPCOMING_CONGRESS_DATES);
  # {{posterBornFrom}} / {{posterBornUntil}} — границы даты рождения для
  # постеров, считаются из первого дня и POSTER_AGE_LIMIT_YEARS.
  # Шаг 2 «Как войти в кабинет» — текст владельца 2026-10-06 (Issue #99,
  # «Утверждённые тексты входа в кабинет», инструкция Б): пять подшагов
  # списком, кнопка и примечание «Если не получилось». Подпись и адрес кнопки —
  # в настройках сайта (CABINET_LOGIN_LABEL / CABINET_LOGIN_URL), здесь только
  # `cta: cabinet-login` у подшага 1, который называет кнопку (владелец
  # 2026-10-07: в конце шага её не находили). Объявление «приём открыт» в блоке
  # «Приём материалов (2027)» выше — последний шаг запуска, не этот блок.
  # Одна инструкция — одна задача (владелец 2026-10-07, Issue #99): кто вошёл
  # одним путём, не видит вход снова. Этот блок — кто может подать и вход по
  # почте, затем кнопка на отдельную страницу «Как заполнить заявку»
  # (/participants/zapolnit-zayavku, zapolnit-zayavku.yaml); туда же ведёт
  # карточка успешной регистрации (#116). Имя блока и кнопка остаются:
  # утверждённый текст писем отправляет читателя в «Как подать материалы» →
  # «Войти в кабинет». Строка под кнопкой — для того, кто уже входил: сессия
  # кабинета живёт 30 дней, вошедшего сразу пускают в /account/congress.
  # Скриншоты — кабинет на стенде DS Platform (2026-10-05), в бакете под
  # 2027/submissions/ (docs/assets-manifest.yaml, item 2027-submissions-guide).
  - kind: submission-guide
    anchor: podat-materialy
    heading: Как подать материалы на VIII Конгресс «Ортобиология 2027»
    # Разложено на абзацы и списки 2026-10-08 (владелец: «сплошная простыня»),
    # факты и формулировки — утверждённые. Как писать — в шапке
    # zapolnit-zayavku.yaml.
    steps:
      - title: Кто может подать материалы
        body:
          - kind: paragraph
            text: 'Только зарегистрированные участники Конгресса. Если вы ещё не зарегистрированы — «Зарегистрироваться».'
            links:
              - text: «Зарегистрироваться»
                href: /registration
          - kind: paragraph
            text: 'Принимаются три вида: устный доклад, постерный доклад и тезисы. Можно подать несколько заявок разных видов.'
          - kind: paragraph
            text: 'Сроки — до 23:59 по московскому времени:'
          - kind: bullets
            items:
              - 'устные доклады — до {{oralTalkDeadline}};'
              - 'постерные доклады и тезисы — до {{posterAbstractDeadline}}.'
      - title: Как войти в кабинет
        body:
          - kind: steps
            items:
              - text: 'Нажмите «Войти в кабинет» — откроется страница входа на сайте Doctor.School, там находится кабинет для подачи материалов.'
                cta: cabinet-login
                note: 'Если вы уже входили в кабинет с этого устройства, он откроется сразу — код не понадобится.'
              - text: 'В поле «Электронная почта» впишите почту, которую указали при регистрации на Конгресс.'
              - text: 'Нажмите «Отправить код».'
                shots:
                  - url: /media/2027/submissions/login-02-by-code-email.png
                    alt: 'Страница входа Doctor.School, способ «По коду», канал «Эл. почта»: в поле «Электронная почта» вписан адрес, под ним кнопка «Отправить код»'
                    width: 492
                    height: 699
              - text: 'Откройте письмо «… — код для входа в Doctor.School» и введите 6 цифр из него. Пароль не нужен.'
                shots:
                  - url: /media/2027/submissions/letter-code.png
                    alt: 'Письмо «… — код для входа в Doctor.School»: шесть цифр кода крупно и подсказка ввести их во вкладке Doctor.School, где код запрошен; код действует 1 час'
                    width: 520
                    height: 423
                  - url: /media/2027/submissions/login-03-check-email.png
                    alt: 'Экран «Проверьте почту»: адрес, на который отправлен код, шесть пустых клеток «Код из письма» и кнопка «Подтвердить и войти»'
                    width: 492
                    height: 560
              - text: 'Откроется кабинет «Мои заявки на Конгресс».'
          - kind: note
            lead: Если не получилось.
            paragraphs:
              - 'Письма нет 2–3 минуты — загляните в «Спам», затем нажмите «Отправить снова».'
              - 'Если на странице входа вы нажали «Создать аккаунт» и ввели ту же почту — тоже придёт код, и вы попадёте в тот же кабинет.'
    next:
      text: Как заполнить заявку
      href: /participants/zapolnit-zayavku
  # «Проживание» (Issue #112). Факты — от отеля через владельца: промокод,
  # сроки, телефоны и почта отдела бронирования. Время пешком от метро здесь не
  # повторяется: оно в карточке площадки на /registration (11 минут, владелец
  # 2026-09-30), а не в тексте отеля. Ссылка на карту берётся из
  # UPCOMING_CONGRESS_VENUE.mapUrl (src/config/site.ts), не отсюда.
  # Промокод в трёх фразах ниже не размечается: сборка сама выделяет его
  # (и почту — ссылкой), а схема падает, если фраза перестала его содержать.
  - kind: accommodation
    heading: Проживание
    lead: Конгресс проходит в отеле «Милан» (Москва, ул. Шипиловская, 28А). Для участников отель предоставляет специальные условия бронирования стандартных номеров по промокоду.
    leadEmphasis: отеле «Милан»
    about: Отель расположен между аэропортом «Домодедово» и центром Москвы, рядом — метро «Домодедовская». Неподалёку музеи-заповедники «Царицыно» и «Коломенское», торговые центры.
    promo:
      label: Промокод для участников
      code: ОРТОБИОЛОГИЯ
      terms: Стандартные номера · проживание с 22 по 25 апреля 2027 года
    waysHeading: Как забронировать
    online:
      title: На сайте отеля
      text: При бронировании введите промокод ОРТОБИОЛОГИЯ в поле промокода.
      url: https://www.hotelmilan.ru/rooms/
      cta: Забронировать на сайте отеля
      screenshot:
        url: /media/2027/accommodation/hotel-promo-field.png
        alt: Окно ввода промокода на странице бронирования отеля «Милан»
        width: 560
        height: 257
      caption: Поле промокода — значок замка в правом верхнем углу страницы бронирования
    phone:
      title: По телефону
      text: Позвоните в отдел бронирования и назовите промокод ОРТОБИОЛОГИЯ.
      numbers:
        - +7 (495) 648-93-00
        - +7 (495) 648-93-02
    email:
      title: По электронной почте
      text: 'Отправьте заявку на reservation@hotelmilan.ru и укажите:'
      address: reservation@hotelmilan.ru
      items:
        - промокод ОРТОБИОЛОГИЯ
        - даты проживания
        - категорию номера
        - ФИО гостей и контакты для оформления брони
    group:
      # Неразрывный пробел ( ) внутри названия: «Доктор» и «Скул» не
      # должны расходиться по строкам.
      text: "Групповые заявки направляйте в АНО «Доктор Скул»: manager@doctor.school"
      email: manager@doctor.school
    contacts:
      heading: Контакты отеля «Милан»
      addressLabel: Адрес
      address: 115563, Москва, ул. Шипиловская, 28А
      bookingLabel: Отдел бронирования
