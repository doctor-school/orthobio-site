# «ОБРАЩЕНИЕ К УЧАСТНИКАМ» — 3 cards, page order. Greeting texts were not
# published (video addresses instead — see videos[]).
#
# Спасённые файлы 2022 в бакете есть (/media/2022/previews/prevyu_zagorodniy.png,
# gubin_prevyu.png, prevyu_strahov.png), но это НЕ портреты, а титульные
# стоп-кадры видео 16:9: левую половину кадра занимает зелёная плашка
# «ОРТОБИОЛОГИЯ 2022» со знаком ОРТО, человек сидит в правой трети. В кружке
# 72px виден кирпич и зелёный скос, а не лицо (жалоба владельца, Issue #16 п.4).
# Ни один из трёх здесь не используется.
#
# Страхов М.А. (Issue #23): взят квадратный студийный портрет с карточки
# оргкомитета живого orthobio.ru/orgs (/media/2026/people/strahov-288.webp).
# Это не перенос факта из соседнего года: внешность человека не датирована,
# а изображение декоративное (alt="") и про 2022 ничего не утверждает.
#
# Issue #54: владелец подтвердил переиспользование и публикацию материалов
# старого сайта. AGENTS.md:69 запрещает копировать факты из соседнего года;
# здесь сознательное исключение: регалии остаются версией своего года,
# переиспользуется только недатированная внешность. Тот же портрет стоит в
# 2023/2024/2025.yaml.
# У Загороднего и Губина карточек на /orgs нет — портретов не существует, и
# плашка с инициалом остаётся санкционированным дизайном состоянием карточки
# (PersonCard.prompt.md: «имя + роль без фото это боевое состояние»).
