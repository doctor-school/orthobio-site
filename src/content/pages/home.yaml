# Подпись обязана делать две вещи и не делать третью. Делает: (1) отделяет цифры
# от 2027 года — раньше она стояла между заголовком 2027 и CTA, то есть в зоне
# описания предстоящего (контент-аудит С2); (2) называет диапазон, который у нас
# АТРИБУТИРОВАН, — 2021-2026, шесть карточек архива.
# НЕ делает: не датирует I конгресс. Год 2020 выводился арифметикой «2026 = VII,
# значит I = 2020», но ежегодность до 2021 года не подтверждена ни одним
# источником (`docs/recon/*` не содержит 2020 вовсе), а стоял этот вывод в самом
# читаемом месте сайта (ревью PR #17). Поэтому «прошедших конгрессов» без нижней
# границы, а годы названы у архива, где каждый из них — карточка.
