# Контакты (/contacts) — ТЗ §4.
# Issue #54: владелец утвердил контакты Doctor.School в src/config/site.ts.
# Адрес welcome@congress-ph.ru принадлежит техническому оператору сайта-2026
# (ООО «Ай Си Эс») и на этом сайте не публикуется. Если значения снова станут
# null, страница показывает ЗАГЛУШКУ, а не одно предложение лида:
# содержательно текст был честен, но выглядел как недописанная страница, а не
# как заявленное состояние (контент-аудит М3). При заполненных контактах
# contacts.astro отбрасывает stub-блок и рендерит секцию с живыми каналами.
#
# ВАЖНО про разделение труда между лидом и заглушкой (ревью PR #17): «страница
# переключается одним значением конфига» верно ровно потому, что лид НЕ говорит
# о состоянии адреса. Раньше он дублировал заглушку («будут опубликованы к
# открытию регистрации»), и в момент появления живого адреса страница показала
# бы его под абзацем о том, что адрес появится позже. Лид описывает, ЧЕМ
# занимается оргкомитет, — это верно и с адресом, и без него; всё про ожидание
# живёт в stub-блоке, который гейтится конфигом.

title: Контакты
