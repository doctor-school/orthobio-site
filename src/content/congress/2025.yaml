program:
  pdf: null
  sessions:
    - title: "Официальное открытие"
      date: "2025-04-18"
      time: "09:00-09:30"
      hall: "Зал 1"
      moderators:
        - "Котенко Константин Валентинович"
        - "Загородний Николай Васильевич"
        - "Назаренко Антон Герасимович"
      talks: []
    - title: "Патология суставного хряща. Часть 1"
      date: "2025-04-18"
      time: "09:30-11:00"
      hall: "Зал 1"
      moderators:
        - "Котенко Константин Валентинович"
        - "Назаренко Антон Герасимович"
        - "Загородний Николай Васильевич"
        - "Лила Александр Михайлович"
        - "Алексеева Людмила Ивановна"
      talks:
        - title: "Инновационные подходы к восстановлению поврежденного суставного хряща: эффективность гидрогеля из пуповины человека"
          speakers:
            - "Чеботарёв Сергей Валерьевич"
        - title: "Биологическая активность тканеинженерного продукта из пуповины человека, предназначенного для восстановления хрящевой ткани"
          speakers:
            - "Александрова Светлана Алексеевна"
        - title: "Цунами ОА"
          speakers:
            - "Алексеева Людмила Ивановна"
        - title: "Эффективность инъекционного гидролизованного коллагена (Композитрон-2) у пациентов с остеоартритом коленного сустава"
          speakers:
            - "Теплякова Ольга Вячеславовна"
        - title: "Минимально манипулированные продукты из жировой ткани. В чем общее и в чем различие?"
          speakers:
            - "Еремин Илья Игоревич"
    - title: "Боль в коленном и тазобедренном суставе, пациент на приеме у травматолога-ортопеда"
      date: "2025-04-18"
      time: "11:15-12:15"
      hall: "Зал 1"
      moderators:
        - "Торгашин Александр Николаевич"
        - "Загородний Николай Васильевич"
        - "Таскина Елена Александровна"
      talks:
        - title: "Осмотр пациента с болью в коленном и тазобедренном суставе, на что обратить внимание?"
          speakers:
            - "Торгашин Александр Николаевич"
        - title: "Возможности органосохраняющих операций в ортопедии"
          speakers:
            - "Загородний Николай Васильевич"
        - title: "Пациент с системным заболеванием и необходимостью оперативного вмешательства, взгляд ревматолога"
          speakers:
            - "Таскина Елена Александровна"
        - title: "Новые возможности в профилактике развития дегенеративных заболеваний суставов"
          speakers:
            - "Загородний Николай Васильевич"
    - title: "ДЕТЕКТИВНАЯ ИСТОРИЯ: что есть в арсенале травматолога для разгадки тайн остеоартрита?"
      date: "2025-04-18"
      time: "13:00-14:00"
      hall: "Зал 1"
      moderators:
        - "Торгашин Александр Николаевич"
        - "Каратеев Андрей Евгеньевич"
        - "Зубков Дмитрий Сергеевич"
      talks:
        - title: "В поисках остеоартрита. Собираем вещественные доказательства…"
          speakers:
            - "Торгашин Александр Николаевич"
        - title: "НОРМА или не НОРМА: поиск баланса в терапии скелетно-мышечной боли"
          speakers:
            - "Каратеев Андрей Евгеньевич"
        - title: "Ведем следствие по верному пути: обзор фармакотерапии в новых клинических рекомендациях «Гонартроз»"
          speakers:
            - "Зубков Дмитрий Сергеевич"
        - title: "Новые возможности в профилактике развития дегенеративных заболеваний суставов"
          speakers:
            - "Загородний Николай Васильевич"
    - title: "Хондропротекторы и PRP – полезен ли нам этот союз?"
      date: "2025-04-18"
      time: "14:15-15:15"
      hall: "Зал 1"
      moderators:
        - "Загородний Николай Васильевич"
      talks:
        - title: "Сочетание PRP и хондропротекторов при внутрисуставном введении: к чему мы стремимся?"
          speakers:
            - "Маланин Дмитрий Александрович"
        - title: "Безопасность и экспериментальное обоснование использования комбинированных ортобиологических продуктов"
          speakers:
            - "Бурка Иван Сергеевич"
        - title: "Возможен ли синергизм PRP и хондропротекторов при лечении остеоартрита коленного сустава? Оправдываются ли ожидания?"
          speakers:
            - "Демещенко Максим Васильевич"
        - title: "Новые возможности в профилактике развития дегенеративных заболеваний суставов"
          speakers:
            - "Загородний Николай Васильевич"
    - title: "Патология суставного хряща. Часть 3"
      date: "2025-04-18"
      time: "16:15-18:05"
      hall: "Зал 1"
      moderators:
        - "Гусев Денис Сергеевич"
        - "Гончаров Евгений Николаевич"
        - "Пашкова Екатерина Анатольевна"
        - "Доколин Сергей Юрьевич"
        - "Орлецкий Анатолий Корнеевич"
      talks:
        - title: "Замещение дефектов хрящевой ткани крупных суставов. Хирургические техники. Отдаленные результаты. Перспективы развития."
          speakers:
            - "Гусев Денис Сергеевич"
        - title: "Лечение гонартроза при помощи SVF. Проспективное исследование."
          speakers:
            - "Гончаров Евгений Николаевич"
        - title: "Суставсберегающие технологии при лечении пациентов с терминальными стадиями остеоартрита голеностопного сустава."
          speakers:
            - "Пашкова Екатерина Анатольевна"
        - title: "Среднесрочные результаты применения ортобиологических технологий при лечении поздних стадий артроза"
          speakers:
            - "Шубняков Максим Игоревич"
        - title: "Экструзия мениска. Что, где, когда?"
          speakers:
            - "Римский Арсений Александрович"
        - title: "Клинический случай сочетания A-PRP терапии и внутрисуставной лазеротерапии при лечении повреждений суставного хряща при гонартрозе 3 степени."
          speakers:
            - "Являнский Олег Николаевич"
        - title: "PRGF в сочетании с абразивной хондропластикой как метод лечения хондромаляции мыщелков бедра."
          speakers:
            - "Атрощенко Игорь Григорьевич, Овсянкин А. В.,"
            - "Шумков П. С."
        - title: "Артроскопическая криоаппликация синовиальной среды коленного сустава"
          speakers:
            - "Кожевников Евгений Владимирович"
