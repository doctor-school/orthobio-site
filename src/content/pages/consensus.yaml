# Консенсусы (/consensus) — Issue #122 (DSG2-55): сборник консенсусов для скачивания.
# Источник фактов: титульный лист и оглавление PDF, присланного владельцем
# (200 стр., 1 991 390 байт), и ответ владельца о названии (см. комментарий над
# блоком documents); сверх них ничего не добавлено.
# overline: null — страница не привязана к конгрессу 2027, плашка года была бы ложной.

title: Консенсусы
overline: null
description: 'Консенсусы 2026: сборник согласованных экспертных позиций по ортобиологии — инъекционные препараты, клеточные продукты, тканевые банки, хирургия. Скачать PDF.'
lead:
  - 'Консенсусы 2026 — сборник согласованных экспертных позиций по ортобиологии. Научное издание под редакцией акад. РАН, д.м.н., проф. Н.В. Загороднего и к.м.н. М.А. Страхова, 200 страниц.'
  - 'На титульном листе сборник назван «Консенсусы. Ортобиология 2024» (Москва, 2025) и указаны четыре организации: МОО «Общество регенеративной травматологии и ортопедии» (ОРТО), Ассоциация травматологов-ортопедов России (АТОР), Медицинская ассоциация специалистов по лечению и изучению остеонекроза (МАПО) и МОО «Общество трансплантологов». Правообладатель — МОО «ОРТО»; сборник предназначен для некоммерческого использования при наличии прямой ссылки на источник.'
blocks:
  # Название «Консенсусы 2026» — слова владельца (2026-10-12, Issue #122): файл верный, это консенсусы 2026 года,
  # хотя на титуле издания стоит «Ортобиология 2024» (Москва, 2025), поэтому lead говорит об этом прямо.
  # Ключ S3 выбран владельцем; объекты отдаются с immutable на год, ключ не переименовывается.
