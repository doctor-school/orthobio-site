# ─────────────────────────────────────────────────────────────────────────────
# SMOKE FIXTURE — NOT A REAL CONGRESS YEAR. `draft: true`, year 2099.
#
# This file doubles as the documented example of the «congress year edition»
# schema (Issue #1 AC). Full contract: src/content/schemas.ts.
#
# Rules for real year files (2021–2026):
#   • one file per year: src/content/congress/<year>.yaml, `year` == filename;
#   • every fact must trace to docs/recon/*.md — unknown facts are `null` or
#     empty lists, NEVER invented, NEVER copied from a neighbouring year;
#   • media (photos, PDFs, logos) live on OUR Timeweb S3 or in public/ —
#     legacy cloud links (Drive, Я.Диск, creatium, congress-ph) fail the build;
#   • prose fields are plain text; RU typography (ёлочки, nbsp, dashes) is
#     applied automatically at the schema boundary — do not hand-typeset.
# ─────────────────────────────────────────────────────────────────────────────

# Year of the edition; must equal the filename (guard against copy-paste).
year: 2099
# Congress ordinal (римская цифра in the title ⇒ arabic here); null if unverified.
number: 80
# Display title without the year; null if unknown.
title: LXXX Конгресс с международным участием "ОРТОБИОЛОГИЯ"
# Human-readable dates; null renders as «даты уточняются» / «нет данных».
dates: 1-2 апреля 2099
# ISO dates for machine use (sorting, schema.org); null when unknown.
startDate: 2099-04-01
endDate: 2099-04-02
# City + venue, plain text; null if unknown.
place: Москва, отель "Тестовый" Сокольники

# Президиум / обращения (ТЗ §3 «Обращения»). Empty list [] = none published.
greetings:
  - name: Иванов Иван Иванович # verbatim, no typography applied
    role: д.м.н., профессор, сопрезидент конгресса # nullable prose
    photo: https://s3.example-fixture.ru/congress/2099/ivanov.jpg # our S3 or /path; nullable
    text: > # nullable plain-text greeting; typography applied at build
      Дорогие коллеги! Рады приветствовать вас на юбилейном - 80-м
      конгрессе "ОРТОБИОЛОГИЯ" в 2099 году.
  - name: Петров Пётр Петрович
    role: null # unknown regalia — explicit null, not a guess
    photo: null
    text: null # persona known, greeting text not published

# Оргкомитет с регалиями (2025: 9 персон; 2026: 12). Empty list = unknown.
committee:
  - name: Сидорова Анна Павловна
    regalia: к.м.н., учёный секретарь конгресса
  - name: Кузнецов Олег Игоревич
    regalia: null

# Программа года: `null` if nothing survived (2021–2023);
# otherwise structured sessions AND/OR a local/S3 PDF (2026 has only pdf).
program:
  pdf: /files/2099/program.pdf # local public/ path or our S3 URL; nullable
  sessions: # [] when only the PDF exists
    - title: Пленарное заседание. Открытие конгресса
      date: 2099-04-01 # ISO day of the session; nullable (groups «день 1/2»)
      time: 09:00-10:30 # nullable free text
      hall: Зал 1 # nullable
      moderators: [Иванов Иван Иванович] # verbatim names
      talks:
        - title: Ортобиология - итоги 70 лет
          speakers: [Иванов Иван Иванович, Петров Пётр Петрович]
        - title: Доклад без объявленных спикеров
          speakers: []
    - title: Секция без известного расписания
      date: null
      time: null
      hall: null
      moderators: []
      talks: []

# Обложка-превью для карточки года на хабе /archive/; null = текстовая карточка.
cover:
  url: https://s3.example-fixture.ru/congress/2099/cover.jpg
  alt: Зал конгресса 2099
  width: 1200 # intrinsic px — required for images (no-CLS rule)
  height: 630

# Фотогалерея: self-hosted S3 URLs only (allowlist в schemas.ts). Empty = нет фото.
# width/height ОБЯЗАТЕЛЬНЫ: astro:assets не может определить размеры remote-фото.
photos:
  - url: https://s3.example-fixture.ru/congress/2099/photo-001.jpg
    alt: Открытие конгресса, президиум на сцене # nullable a11y text
    width: 1600
    height: 1067
  - url: https://s3.example-fixture.ru/congress/2099/photo-002.jpg
    alt: null
    width: 1600
    height: 1067

# Постеры года (2026: 4 постера). Изображение (width/height обязательны)
# или PDF (width/height: null). [] = нет постеров.
posters:
  - url: https://s3.example-fixture.ru/congress/2099/poster-1.jpg
    title: Постер конгресса, вариант 1
    width: 800
    height: 1200
  - url: /files/2099/poster-2.pdf
    title: Постер конгресса (PDF)
    width: null
    height: null

# Видеоотчёт (слоты из шаблона архива; почти всегда пустые). [] = нет видео.
videos:
  - url: https://s3.example-fixture.ru/congress/2099/report.mp4
    title: Видеоотчёт конгресса

# Сборник тезисов — local/S3 PDF; null when none exists or not yet rescued.
theses:
  pdf: /files/2099/theses.pdf
  title: Сборник тезисов LXXX конгресса

# Партнёры и организаторы года, tiered. Allowed tiers:
# organizer | co-organizer | strategic | general | partner | exhibition | info
partners:
  - name: Doctor.School # verbatim brand, no typography
    tier: organizer
    logo: /images/partners/doctor-school.svg # nullable
    url: https://doctor.school # nullable; external attribution link is OK here
  - name: ФГБУ НМИЦ ТО им. Н.Н. Приорова (ЦИТО)
    tier: co-organizer
    logo: null
    url: null
  - name: Тестовый стратегический партнёр
    tier: strategic
    logo: null
    url: null
  - name: Тестовый инфопартнёр
    tier: info
    logo: null
    url: null

# Fixtures / unverified years are drafts; excluded from prod builds later (Issue #4).
draft: true
