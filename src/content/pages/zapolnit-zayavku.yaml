# «Как заполнить заявку» (/participants/zapolnit-zayavku) — шаги в кабинете
# подачи материалов, отдельной страницей (владелец 2026-10-07, Issue #99): одна
# инструкция — одна задача. Сюда ведут кнопка в конце «Как подать материалы» на
# /participants и карточка успешной регистрации (#116); старая ссылка
# /participants#zapolnit-zayavku пересылается сюда скриптом на /participants.
# Про вход — только одна строка вверху со ссылкой на «Как подать материалы»:
# читатель здесь, как правило, уже в кабинете.
# Даты — только токены из настроек сайта (src/config/site.ts):
# {{oralTalkDeadline}} / {{posterAbstractDeadline}} — SUBMISSION_DEADLINES;
# {{congressStartDay}} — первый день конгресса (UPCOMING_CONGRESS_DATES);
# {{posterBornFrom}} / {{posterBornUntil}} — границы даты рождения для
# постеров, считаются из первого дня и POSTER_AGE_LIMIT_YEARS.
# Скриншоты — кабинет на стенде DS Platform (2026-10-05), в бакете под
# 2027/submissions/ (docs/assets-manifest.yaml, item 2027-submissions-guide).

title: Как заполнить заявку
description: 'Как заполнить заявку на доклад, постер или тезисы VIII конгресса ОРТОБИОЛОГИЯ в личном кабинете: виды заявок, поля, сроки и статусы.'
blocks:
  # Разделы 3–10 прежней инструкции дословно, с их скриншотами, под номерами
  # 1–8; входа здесь нет. Шаги — #zapolnit-zayavku-1 … -8.
  # Шаги 7 и 8: «пока приём открыт» заменено датами (владелец 2026-10-05,
  # вслед за кабинетом, ds-platform #2573: срок «Забрать на исправление» —
  # окончание приёма своего вида). В «Тезисах» ссылка «(раздел 5)» — на
  # «Согласие» после перенумерации (было «раздел 7»).
  - kind: submission-guide
    anchor: zapolnit-zayavku
    # Заголовок блока — это <h1> страницы (title выше), второй не нужен.
    heading: null
    intro:
      text: 'Заявку заполняют в личном кабинете. Если вы ещё не вошли — как войти в кабинет.'
      links:
        - text: как войти в кабинет
          href: /participants#podat-materialy
    steps:
      - title: Кабинет «Мои заявки на Конгресс»
        text: 'Новая заявка: 1) «+ Новая заявка»; 2) вид — «Устный доклад», «Постерный доклад» или «Тезисы» (под каждым — срок приёма, у тезисов — «Отправлено N тезис из 3»); 3) «Начать заявку →». Вы сразу указаны первым автором (ФИО и место работы — из регистрации). Черновик сохраняется сам: кнопки «Сохранить» нет, вверху «Сохраняем…» → «Сохранено»; можно уйти и вернуться — заявка в списке со статусом «Черновик», «Продолжить →». «Удалить черновик» — без восстановления. Список «Мои заявки»: статус, тема, вид, дата изменения; фильтры «Все», «Черновики», «Отправлены» и др.'
        shots:
          - url: /media/2027/submissions/01-cabinet-empty.png
            alt: 'Кабинет «Мои заявки на Конгресс», блок «Новая заявка»: выбор вида заявки — «Устный доклад», «Постерный доклад» или «Тезисы», у каждого срок приёма и ссылка «Начать заявку», у тезисов — счётчик «Отправлено 0 тезисов из 3»'
            width: 1080
            height: 544
          - url: /media/2027/submissions/11-list-with-statuses-v2.png
            alt: 'Список «Мои заявки» с фильтрами «Все», «Черновики», «Отправлены» и кнопкой «+ Новая заявка»: черновик постерного доклада с действиями «Продолжить» и «Удалить черновик», отправленный устный доклад со сроком исправления и действиями «Забрать на исправление» и «Подать тезисы по этой работе»'
            width: 1048
            height: 385
      - title: Устный доклад
        text: 'Формат — очный. «Тема» (до 300 знаков); «Авторы» (до 20; «Фамилия», «Имя», «Место работы», «Отчество» — если есть; «+ Добавить автора», «Выше»/«Ниже»; один — «Докладчик»); «Образовательная цель» (до 1 000 знаков); «Краткое содержание» (до 3 000 знаков). По «Отправить» проверяем, что всё заполнено и отмечен ровно один докладчик; иначе — список того, что исправить. Затем вопрос «Отправить заявку в программный комитет?» → «Да, отправить».'
        shots:
          - url: /media/2027/submissions/03-oral-form-authors.png
            alt: 'Форма устного доклада: поле «Тема» и список авторов с отметкой «Докладчик», кнопками перемещения и полями «Фамилия», «Имя», «Отчество», «Место работы» у редактируемого автора; ниже — «+ Добавить автора»'
            width: 808
            height: 698
          - url: /media/2027/submissions/04-oral-form-text.png
            alt: 'Раздел «Содержание» формы устного доклада: поля «Образовательная цель» и «Краткое содержание», согласие на обработку персональных данных, отметка «Сохранено» и кнопка «Отправить»'
            width: 808
            height: 590
          - url: /media/2027/submissions/05-validation-errors.png
            alt: 'Сообщение «Заявка не отправлена. Исправьте 4 ошибки» со списком незаполненных полей, каждый пункт — ссылка на поле'
            width: 808
            height: 366
          - url: /media/2027/submissions/07-submit-confirm-v2.png
            alt: 'Отмеченное согласие на обработку персональных данных и вопрос «Отправить заявку в программный комитет?»: после отправки редактирование закроется, до срока заявку можно забрать на исправление; кнопки «Отмена» и «Да, отправить»'
            width: 808
            height: 267
      - title: Постерный доклад
        text: '«Тема»; «Авторы» (без докладчика, порядок — как в публикации); «Цель» (до 1 000); «Содержание» (до 3 000); «Дата рождения» — один раз, запоминаем. Постеры — от участников младше 40 лет на {{congressStartDay}}: родились {{posterBornFrom}} или позже — можно; {{posterBornUntil}} или раньше — нельзя, устные доклады и тезисы доступны. Файлы постеров и правила оформления организаторы пришлют позже.'
        shots:
          - url: /media/2027/submissions/08-poster-birthdate.png
            alt: 'Форма постерного доклада: поле «Тема» и поле «Дата рождения» с пояснением, что её спрашивают один раз, перед первым постером'
            width: 808
            height: 305
          - url: /media/2027/submissions/09-poster-age-refusal.png
            alt: 'Предупреждение в форме постерного доклада: постерные доклады принимают от участников младше 40 лет на дату начала Конгресса, указанная дата рождения не подходит'
            width: 808
            height: 449
      - title: Тезисы
        text: '«Название тезисов»; «Авторы» (порядок публикации); «Текст тезисов» — «Актуальность», «Цель», «Материалы и методы», «Результаты и обсуждение», «Выводы». Всего не больше 5 000 знаков с пробелами, один общий счётчик («4 980 / 5 000»). Только текст — без таблиц, формул, рисунков и фото. Перед отправкой: «В тексте нет некорректных заимствований», «В тексте нет торговых наименований». Не больше 3 тезисов от одного автора: считаются все отправленные, включая отклонённые и отозванные; не считаются черновики и забранные на исправление до начала рассмотрения. Публикацию, в том числе в РИНЦ, покрывает согласие (раздел 5). Тезисы — не заявка на доклад; «Подать тезисы по этой работе» на карточке доклада переносит тему и авторов.'
        shots:
          - url: /media/2027/submissions/10-abstract-form.png
            alt: 'Форма тезисов: пять полей — «Актуальность», «Цель», «Материалы и методы», «Результаты и обсуждение», «Выводы», отметки «В тексте нет некорректных заимствований» и «В тексте нет торговых наименований», общий счётчик знаков из 5 000 и кнопка «Отправить»'
            width: 808
            height: 1039
      - title: Согласие на обработку персональных данных
        text: 'При первой отправке — «Согласие на обработку персональных данных» (полный текст по ссылке). Одно на все виды: содержание заявки, данные соавторов, дата рождения, передача программному комитету и партнёру Конгресса, публикация тезисов.'
        shots:
          - url: /media/2027/submissions/06-consent-and-submit.png
            alt: 'Раздел «Подтверждения»: отмеченное согласие на обработку персональных данных со ссылкой на полный текст и кнопка «Отправить»'
            width: 808
            height: 220
      - title: Сроки
        text: 'До 23:59 МСК включительно: устный доклад — {{oralTalkDeadline}}; постерный доклад и тезисы — {{posterAbstractDeadline}}. После последнего дня черновик можно прочитать, но не отправить.'
      - title: После отправки
        text: 'Письмо «Doctor.School — заявка получена». Статусы: «Отправлена» — ждёт комитет, можно «Забрать на исправление» до окончания приёма своего вида: устные доклады — до {{oralTalkDeadline}}, постерные доклады и тезисы — до {{posterAbstractDeadline}}; «На рассмотрении» — править нельзя; «Принята» — придёт письмо; «Отклонена» — письмо с комментарием, он же в кабинете; «На доработке» — 3 рабочих дня до 23:59 МСК, точный срок в письме и кабинете, «Отправить снова» — даже после закрытия общего приёма; «Отозвана» — комитет не рассмотрит. «Отозвать» — пока нет решения; после «Принята»/«Отклонена» — нельзя.'
        shots:
          - url: /media/2027/submissions/12-sent-card-actions-v2.png
            alt: 'Карточка отправленной заявки со статусом «Отправлена», датой отправки и сроком исправления, действиями «Забрать на исправление» и «Подать тезисы по этой работе»'
            width: 1018
            height: 125
      - title: Частые вопросы
        text: 'Приём закрылся, заявка в черновиках — отправить нельзя. Четвёртые тезисы — не больше 3 от автора. Постер не подходит по возрасту — устный доклад и тезисы. Изменить после отправки — пока заявка «Отправлена», до окончания приёма своего вида (устные доклады — до {{oralTalkDeadline}}, постерные доклады и тезисы — до {{posterAbstractDeadline}}): «Забрать на исправление» → исправить → «Отправить»; после начала рассмотрения — только при возврате на доработку. Доклад и тезисы по одной работе — да, две заявки. Несколько заявок — да, устные и постерные без ограничения количества.'
