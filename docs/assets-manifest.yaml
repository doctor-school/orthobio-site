# ─────────────────────────────────────────────────────────────────────────────
# Partner / organizer logos (Issue #22) — rescued 2026-07-29
#
# Why they are here and not in `years:` above: a logo is a BRAND MARK, not a
# fact about one congress. The library is keyed by organization and one object
# serves every edition that organization took part in — which is what lets the
# 2024/2025 sponsor rosters (whose own archive pages carry no logos at all)
# show a mark. Which year references which object is decided in
# `src/content/congress/<year>.yaml`, not here.
#
# Sources — all JS-rendered, which is why the 2026 recon pass (plain WebFetch,
# docs/recon/orthobio-ru-main.md) reported no logos and archive-2021.md marked
# the logo sources «Сохранять? → нет». Owner reversed that call in Issue #22.
#   https://orthobio.ru/orgs — 5
#   https://orthobio2021.creatium.site/archive/2025 — 13
#   https://orthobio.ru/exhibition — 22
#   https://orthobio.ru/partners — 9
#
# Reproduce the staging tree with `node scripts/rescue-partner-logos.mjs`
# (Playwright; writes <out>/ originals and <out>/web/ derivatives + index.json).
# Local staging lives in a gitignored worktree dir — binaries are NEVER
# committed; the bucket is the durable copy.
#
# `original` = the file as the source site serves it. `object` = what is in
# the bucket: resize to a 240px long side + re-encode, nothing else. No
# recolouring and no background removal — the congress-ph tiles are
# heterogeneous (white knockout marks on the old site's green field alongside
# companies' own logos pasted onto that field), so a blanket "make the
# background transparent" pass would mangle the second group. The originals are
# 512×512 PNGs stored uncompressed (1.03 MB each, 37.3 MiB for the set);
# shipping them unresized would put tens of megabytes on /partners.
#
# `source_alt` = the alt text the source page carries on that mark, captured
# verbatim. It is the only INDEPENDENT evidence that the URL→organization
# binding in scripts/rescue-partner-logos.mjs points at the right company: the
# table itself is hand-authored. 27 of the 49 marks have one and all 27 agree
# with `org` (the crawler now reports any that do not); the remaining 22 —
# the 13 Creatium соорганизаторы and 9 info partners — ship no alt at source,
# so their binding rests on the source URL alone. Recorded here because
# cdn.congress-ph.online will not outlive this site (PR #36 review).
#
# 19 partners across 2021/2024/2025/2026 keep `logo: null` — no mark exists on
# any surviving source (see the per-year comments in the content YAML).
