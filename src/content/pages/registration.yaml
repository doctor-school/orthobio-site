# Регистрация на конгресс (/registration) — Issue #78.
#
# Левая колонка страницы: заголовок, вводный текст (что участник получит после
# отправки), даты окна регистрации и карточка площадки с картой (Issue #82). Форма, её подписи и состояния («откроется …»,
# «закрыта», «заявка принята») живут в SignupForm.astro — это интерфейс, а не
# редакционный текст. Даты сюда НЕ пишутся: открытие и закрытие регистрации
# страница печатает из REGISTRATION_WINDOW (src/config/site.ts), окно приёма
# докладов и тезисов — из SUBMISSION_WINDOW (Issue #98), даты конгресса —
# из UPCOMING_CONGRESS_DATES, площадку — из UPCOMING_CONGRESS_VENUE, так что у
# факта одно место правки.

title: Регистрация участников
overline: VIII конгресс · 2027
description: Регистрация участников VIII конгресса ОРТОБИОЛОГИЯ 2027 по регенеративной травматологии и ортопедии.
lead:
  - 'Заполните форму, чтобы зарегистрироваться на VIII конгресс ОРТОБИОЛОГИЯ. После отправки заявки мы создадим для вас учётную запись на платформе Doctor.School и пришлём письмо с подтверждением на указанный адрес электронной почты.'
  - 'Все поля, кроме отчества, обязательны для заполнения.'
