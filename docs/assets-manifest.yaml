# Assets rescue manifest — Congress ОРТОБИОЛОГИЯ archive 2021–2026 (Issue #2)
#
# Rescued on 2026-07-27 from seven external platforms before link rot.
# Local staging: C:\Users\sidor\orthobio-assets\<year>\... (outside the repo;
# binaries are NEVER committed to git).
#
# S3 status: pending-credentials.
#   Survey result (reuse-before-provision): the only existing Timeweb S3 bucket
#   on this account is the bbm-public-website CDN origin (see
#   bbm-public-website/infra/terraform/). Its deploy workflow runs a nightly
#   `aws s3 sync --delete` prune, so foreign objects uploaded there are wiped
#   within 24h — it CANNOT host orthobio assets. A dedicated orthobio bucket is
#   a paid resource (owner gate). Once the owner provisions it (Terraform
#   pattern exists in bbm-public-website/infra/terraform), upload the staging
#   tree as-is: local path <year>/... maps 1:1 to S3 key <year>/... .
#   Env var names (values host-side only): TIMEWEB_S3_ACCESS_KEY,
#   TIMEWEB_S3_SECRET_KEY, TIMEWEB_S3_ENDPOINT, TIMEWEB_S3_BUCKET,
#   TIMEWEB_S3_REGION.
#
# Statuses: downloaded | not-found | owner-step | pending-credentials
# (s3_key values are the PLANNED keys; each item's s3 upload is
# pending-credentials until the orthobio bucket exists.)
#
# ⚠️ Year attribution: the Google Drive folders «15 апреля»/«16 апреля»
# (1MaNlskHjkZpxm9XzYkgSky-Jfb2o3xGK / 1fJ5BoMr1Tc2jPPDFpNQ6jDk5eSzmryN1)
# contain photos of the 2022 congress (15–16.04.2022) but were copy-pasted onto
# the 2023/2024/2025 archive pages. They are attributed here to 2022 ONLY.

