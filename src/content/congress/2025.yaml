  - name: Лазишвили Гурам Давидович
    regalia: Д.м.н., профессор кафедры травматологии, ортопедии и военно-полевой хирургии ПФ РНИМУ им. Н.И. Пирогова, Заслуженный врач Российской Федерации. (г. Москва)
